<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R2 ONLINE 자산 관리</title>

<!-- ===================== Firebase SDK (compat) ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#0e1116; --bg2:#161b22; --bg3:#1f2630; --line:#2b333f;
    --text:#e6edf3; --muted:#8b97a6;
    --gold:#f5c451; --gold-d:#caa233; --green:#5bd17a; --red:#ff6b6b; --blue:#5aa9ff;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif; font-size:14px; line-height:1.5;}

  /* ===== 헤더 ===== */
  header{
    background:linear-gradient(90deg,#1a1f27,#10141a); border-bottom:2px solid var(--gold-d);
    padding:14px 22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  header h1{margin:0; font-size:19px; letter-spacing:1px; color:var(--gold); display:flex; align-items:center; gap:10px; white-space:nowrap;}
  header h1 .badge{font-size:11px; background:var(--gold); color:#1a1500; padding:2px 8px; border-radius:6px; font-weight:700; letter-spacing:0;}
  .hnav{display:flex; gap:8px;}
  .hnav button{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:8px 16px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; transition:.15s;
  }
  .hnav button:hover{color:var(--text); border-color:var(--gold);}
  .hnav button.active{color:var(--gold); border-color:var(--gold); background:rgba(245,196,81,.1);}
  .total-banner{margin-left:auto; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:8px 18px; text-align:right;}
  .total-banner .label{font-size:11px; color:var(--muted);}
  .total-banner .value{font-size:21px; font-weight:800; color:var(--gold);}
  .total-banner .sub{font-size:11px; color:var(--muted);}

  .wrap{max-width:1200px; margin:0 auto; padding:22px;}
  #status{font-size:12px; color:var(--muted); margin-bottom:16px;}
  #status b{color:var(--green);} #status.err b{color:var(--red);}

  .view{display:none;} .view.active{display:block;}
  .panel-box{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:18px;}
  .section-title{font-size:13px; color:var(--gold); font-weight:700; letter-spacing:.5px; margin:0 0 14px;}

  /* ===== 대시보드 ===== */
  .dash-top{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px;}
  .stat{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden;}
  .stat::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold);}
  .stat .label{font-size:12px; color:var(--muted);}
  .stat .num{font-size:26px; font-weight:800; color:var(--gold); margin-top:4px;}
  .stat.blue::before{background:var(--blue);} .stat.blue .num{color:var(--blue);}
  .stat.green::before{background:var(--green);} .stat.green .num{color:var(--green);}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media(max-width:760px){ .dash-grid{grid-template-columns:1fr;} }
  .bar-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .bar-row.clickable{cursor:pointer;}
  .bar-row .nm{width:110px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{flex:1; background:var(--bg3); border-radius:7px; height:24px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:7px; background:linear-gradient(90deg,var(--gold-d),var(--gold)); min-width:2px; transition:width .3s;}
  .bar-row .vl{width:92px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; font-size:13px;}
  .bar-row.clickable:hover .nm{color:var(--gold);}

  /* ===== 캐릭터 카드 ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .card{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:18px; cursor:pointer; transition:.15s; position:relative; overflow:hidden;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold-d); opacity:.7;}
  .card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .card .cname{font-size:17px; font-weight:700; margin-bottom:10px; padding-right:24px;}
  .card .cmeta{font-size:12px; color:var(--muted); margin-bottom:14px;}
  .card .cprice{font-size:20px; font-weight:800; color:var(--gold);}
  .card .cprice small{font-size:11px; color:var(--muted); font-weight:400;}
  .card .arrow{position:absolute; bottom:14px; right:16px; color:var(--gold); font-size:18px;}
  .card.add{display:flex; align-items:center; justify-content:center; flex-direction:column; border-style:dashed; color:var(--muted); min-height:120px;}
  .card.add::before{display:none;}
  .card.add:hover{color:var(--gold);} .card.add .plus{font-size:34px; line-height:1;}

  /* ===== 상세 ===== */
  .detail-head{display:flex; align-items:center; gap:14px; margin:14px 0 18px; flex-wrap:wrap;}
  .detail-head input.cname-edit{background:transparent; border:none; border-bottom:2px solid var(--line); color:var(--gold); font-size:22px; font-weight:800; padding:4px 2px; min-width:200px;}
  .detail-head input.cname-edit:focus{outline:none; border-color:var(--gold);}
  .ctotal-box{margin-left:auto; text-align:right;}
  .ctotal-box .label{font-size:11px; color:var(--muted);}
  .ctotal-box .value{font-size:22px; font-weight:800; color:var(--gold);}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  table{width:100%; border-collapse:collapse; min-width:760px;}
  th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle;}
  thead th{background:#1d2530; color:var(--gold); font-size:12px; letter-spacing:.5px; white-space:nowrap;}
  tbody tr:hover{background:#1a212b;}
  td.price{text-align:right; font-variant-numeric:tabular-nums; font-weight:600;}
  td.cat{font-weight:700; white-space:nowrap;}
  .chip{display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:700;}
  .empty-msg{padding:40px; text-align:center; color:var(--muted);}
  .c-캐릭터{background:#2e2418; color:#f0c674;} .c-무기{background:#2a1d1d; color:#ff9b9b;}
  .c-방어구{background:#1d2a22; color:#8fe0a8;} .c-악세사리{background:#1d2230; color:#9bc4ff;}
  .c-메테리얼{background:#2a1d2a; color:#e6a8e6;} .c-창고{background:#262626; color:#cfcfcf;}
  .status-chip{font-size:11px; padding:2px 8px; border-radius:6px;}
  .s-보유{background:#1d2a22; color:#8fe0a8;} .s-판매대기{background:#2e2818; color:#f0c674;}
  .s-판매완료{background:#26222e; color:#b89bff;} .s-기타{background:#262626; color:#cfcfcf;}
  .row-actions{display:flex; gap:6px; white-space:nowrap;}

  /* ===== 버튼 ===== */
  button{font-family:inherit;}
  .btn{border:1px solid var(--line); background:var(--bg3); color:var(--text); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; transition:.15s;}
  .btn:hover{border-color:var(--gold);}
  .btn.primary{background:var(--gold); color:#1a1500; border-color:var(--gold); font-weight:700;}
  .btn.primary:hover{background:#ffd56b;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red); border-color:#4a2a2a;} .btn.danger:hover{background:#2a1a1a;}
  .btn.sm{padding:4px 9px; font-size:12px;}

  /* ===== 모달 ===== */
  .modal-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--bg2); border:1px solid var(--line); border-radius:14px; width:100%; max-width:460px; padding:22px; max-height:90vh; overflow-y:auto;}
  .modal h3{margin:0 0 18px; color:var(--gold); font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .field input,.field select{width:100%; background:var(--bg3); border:1px solid var(--line); color:var(--text); padding:9px 11px; border-radius:8px; font-size:14px; font-family:inherit;}
  .field input:focus,.field select:focus{outline:none; border-color:var(--gold);}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:8px;}
  @media(max-width:600px){ .total-banner{margin-left:0;} .wrap{padding:14px;} }
</style>
</head>
<body>

<header>
  <h1>⚔️ R2 ONLINE <span class="badge">FIREBASE</span></h1>
  <nav class="hnav">
    <button id="nav-dash" onclick="showView('dash')">📊 대시보드</button>
    <button id="nav-list" onclick="showView('list')">🧝 캐릭터 목록</button>
  </nav>
  <div class="total-banner">
    <div class="label">전체 자산 합계</div>
    <div class="value" id="grandTotal">0</div>
    <div class="sub" id="grandSub">캐릭터 0개</div>
  </div>
</header>

<div class="wrap">
  <div id="status">데이터베이스 연결 중...</div>

  <!-- ===== 대시보드 ===== -->
  <div class="view" id="view-dash">
    <div class="dash-top">
      <div class="stat"><div class="label">전체 자산</div><div class="num" id="d_total">0</div></div>
      <div class="stat blue"><div class="label">캐릭터 수</div><div class="num" id="d_chars">0</div></div>
      <div class="stat green"><div class="label">아이템 수</div><div class="num" id="d_items">0</div></div>
    </div>
    <div class="dash-grid">
      <div class="panel-box">
        <h3 class="section-title">캐릭터별 자산 (클릭 시 상세)</h3>
        <div id="d_charBars"></div>
      </div>
      <div class="panel-box">
        <h3 class="section-title">카테고리별 자산 합계</h3>
        <div id="d_catBars"></div>
      </div>
    </div>
  </div>

  <!-- ===== 캐릭터 목록 ===== -->
  <div class="view" id="view-list">
    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- ===== 상세 ===== -->
  <div class="view" id="view-detail">
    <button class="btn ghost" onclick="showView('list')">← 캐릭터 목록</button>
    <div class="detail-head">
      <input class="cname-edit" id="detailName" placeholder="캐릭터 이름" onchange="renameCharacter()">
      <button class="btn danger sm" onclick="deleteCharacter()">캐릭터 삭제</button>
      <div class="ctotal-box">
        <div class="label">이 캐릭터 합계</div>
        <div class="value" id="detailTotal">0</div>
      </div>
    </div>
    <div style="margin-bottom:14px;">
      <button class="btn primary" onclick="openItemModal()">＋ 아이템 추가</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:90px;">구분</th><th style="width:130px;">대항목</th><th>소항목</th>
          <th style="width:130px; text-align:right;">판매 예상 가격</th>
          <th style="width:90px;">상태</th><th>비고</th><th style="width:110px;">관리</th>
        </tr></thead>
        <tbody id="itemBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ===== 아이템 모달 ===== -->
<div class="modal-bg" id="itemModal">
  <div class="modal">
    <h3 id="modalTitle">아이템 추가</h3>
    <div class="field"><label>구분</label>
      <select id="f_category" onchange="updateTypeHints()">
        <option>캐릭터</option><option>무기</option><option>방어구</option>
        <option>악세사리</option><option>메테리얼</option><option>창고</option>
      </select>
    </div>
    <div class="field"><label>대항목 (예: 갑옷, 반지, 파괴 ...)</label>
      <input id="f_type" list="typeHints" placeholder="대항목 입력"><datalist id="typeHints"></datalist>
    </div>
    <div class="field"><label>소항목 (아이템 상세)</label>
      <input id="f_detail" placeholder="예: 7벨제, 8대검, 파괴의 반지 ...">
    </div>
    <div class="field"><label>판매 예상 가격 (원)</label>
      <input id="f_price" type="number" inputmode="numeric" placeholder="0">
    </div>
    <div class="field"><label>아이템 상태</label>
      <select id="f_status"><option>보유</option><option>판매대기</option><option>판매완료</option><option>기타</option></select>
    </div>
    <div class="field"><label>비고</label><input id="f_note" placeholder="메모 (선택)"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeItemModal()">취소</button>
      <button class="btn primary" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<script>
/* ===== 1) Firebase 설정 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBD5-AJDFJKsneHyqH70SlNU9VixDAHl3o",
  authDomain: "openzeroc.firebaseapp.com",
  projectId: "openzeroc",
  storageBucket: "openzeroc.firebasestorage.app",
  messagingSenderId: "465944510778",
  appId: "1:465944510778:web:df0d19b7c6b98d129f5003",
  measurementId: "G-M4K79K2XPG"
};
let db, COL;
const FIREBASE_OK = (typeof firebase !== "undefined");
if (FIREBASE_OK){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  try{ db.settings({ experimentalAutoDetectLongPolling:true, merge:true }); }catch(e){}
  COL = db.collection("r2online");
}

/* ===== 2) 상수/상태 ===== */
const CATEGORIES = ["캐릭터","무기","방어구","악세사리","메테리얼","창고"];
const TYPE_HINTS = {
  "캐릭터":["본캐","부캐"], "무기":["무기"],
  "방어구":["갑옷","투구","부츠","장갑","망토","방패"],
  "악세사리":["반지","목걸이","귀걸이","벨트"],
  "메테리얼":["파괴","수호","숙련","영혼","생명"], "창고":["기타"]
};
const CAT_COLOR = {"캐릭터":"#f0c674","무기":"#ff9b9b","방어구":"#8fe0a8","악세사리":"#9bc4ff","메테리얼":"#e6a8e6","창고":"#cfcfcf"};

let characters = [];
let currentId = null;
let curView = "dash";          // dash | list | detail
let editingIndex = null;

/* ===== 3) 유틸 ===== */
const won = n => (Number(n)||0).toLocaleString("ko-KR");
const $ = id => document.getElementById(id);
const getCurrent = () => characters.find(c=>c.id===currentId);
const itemTotal = items => (items||[]).reduce((s,it)=>s+(Number(it.price)||0),0);
function setStatus(msg,err){ const el=$("status"); el.className=err?"err":""; el.innerHTML=msg; }
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ===== 4) 로드/저장 ===== */
async function loadAll(){
  let answered=false;
  setTimeout(()=>{ if(!answered) setStatus(
    "⏳ 응답 지연 중.<br>· Firestore Database가 <b>생성</b>되어 있는지 (Build → Firestore Database)<br>· 회사망이 <b>firestore.googleapis.com</b>을 막는지 (핫스팟 테스트)", true);
  },8000);
  try{
    const snap = await COL.orderBy("order").get();
    answered=true;
    characters = snap.docs.map(d=>({id:d.id, ...d.data()}));
    setStatus('데이터베이스 연결됨 · <b>정상</b>');
    render();
  }catch(e){ answered=true; console.error(e); setStatus('연결 실패: '+e.message,true); }
}
async function saveCurrent(){
  const c=getCurrent(); if(!c) return;
  try{ await COL.doc(c.id).update({ name:c.name, order:c.order, items:c.items, updatedAt:Date.now() }); }
  catch(e){ alert("저장 실패: "+e.message); }
}

/* ===== 5) 화면 전환 ===== */
function showView(v){
  curView = v;
  if(v!=="detail") currentId = null;
  ["dash","list","detail"].forEach(x=>$("view-"+x).classList.toggle("active", x===v));
  $("nav-dash").classList.toggle("active", v==="dash");
  $("nav-list").classList.toggle("active", v==="list" || v==="detail");
  render();
}
function render(){
  renderGrand();
  if(curView==="dash") renderDash();
  else if(curView==="list") renderList();
  else if(curView==="detail") renderDetail();
}
function renderGrand(){
  const grand = characters.reduce((s,c)=>s+itemTotal(c.items),0);
  $("grandTotal").textContent = won(grand);
  $("grandSub").textContent = "캐릭터 "+characters.length+"개";
}

/* ===== 6) 대시보드 ===== */
function renderDash(){
  const grand = characters.reduce((s,c)=>s+itemTotal(c.items),0);
  const itemCnt = characters.reduce((s,c)=>s+(c.items?c.items.length:0),0);
  $("d_total").textContent = won(grand);
  $("d_chars").textContent = characters.length;
  $("d_items").textContent = itemCnt;

  const charData = characters.map(c=>({id:c.id, name:c.name||"이름없음", val:itemTotal(c.items)}))
                             .sort((a,b)=>b.val-a.val);
  const maxC = Math.max(1, ...charData.map(d=>d.val));
  $("d_charBars").innerHTML = charData.length ? charData.map(d=>`
    <div class="bar-row clickable" onclick="openDetail('${d.id}')">
      <div class="nm">${escapeHtml(d.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.val/maxC*100)}%"></div></div>
      <div class="vl">${won(d.val)}</div>
    </div>`).join("") : `<div class="empty-msg">캐릭터가 없습니다.</div>`;

  const catSum={}; CATEGORIES.forEach(c=>catSum[c]=0);
  characters.forEach(c=>(c.items||[]).forEach(it=>{ if(catSum[it.category]!=null) catSum[it.category]+=Number(it.price)||0; }));
  const maxK = Math.max(1, ...Object.values(catSum));
  $("d_catBars").innerHTML = CATEGORIES.map(cat=>`
    <div class="bar-row">
      <div class="nm" style="color:${CAT_COLOR[cat]}">${cat}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(catSum[cat]/maxK*100)}%; background:${CAT_COLOR[cat]}"></div></div>
      <div class="vl">${won(catSum[cat])}</div>
    </div>`).join("");
}

/* ===== 7) 캐릭터 목록 ===== */
function renderList(){
  const grid=$("cardGrid"); grid.innerHTML="";
  characters.forEach(c=>{
    const div=document.createElement("div");
    div.className="card"; div.onclick=()=>openDetail(c.id);
    div.innerHTML=`
      <div class="cname">${escapeHtml(c.name||"이름없음")}</div>
      <div class="cmeta">아이템 ${(c.items||[]).length}개</div>
      <div class="cprice">${won(itemTotal(c.items))} <small>원</small></div>
      <div class="arrow">›</div>`;
    grid.appendChild(div);
  });
  const add=document.createElement("div");
  add.className="card add"; add.onclick=addCharacter;
  add.innerHTML=`<div class="plus">＋</div><div>캐릭터 추가</div>`;
  grid.appendChild(add);
}

/* ===== 8) 상세 ===== */
function openDetail(id){ currentId=id; showView("detail"); }
function renderDetail(){
  const c=getCurrent();
  if(!c){ showView("list"); return; }
  $("detailName").value=c.name||"";
  $("detailTotal").textContent=won(itemTotal(c.items));

  const body=$("itemBody"); body.innerHTML="";
  const items=c.items||[];
  if(items.length===0){
    body.innerHTML=`<tr><td colspan="7" class="empty-msg">아이템이 없습니다. ＋ 아이템 추가 버튼으로 등록하세요.</td></tr>`;
    return;
  }
  CATEGORIES.forEach(cat=>{
    const rows=items.map((it,idx)=>({it,idx})).filter(r=>r.it.category===cat);
    rows.forEach((r,i)=>{
      const it=r.it; const tr=document.createElement("tr");
      const catCell = (i===0) ? `<td class="cat" rowspan="${rows.length}"><span class="chip c-${cat}">${cat}</span></td>` : "";
      tr.innerHTML=`
        ${catCell}
        <td>${escapeHtml(it.type)}</td>
        <td>${escapeHtml(it.detail)}</td>
        <td class="price">${ it.price ? won(it.price) : "" }</td>
        <td><span class="status-chip s-${it.status||"기타"}">${it.status||"-"}</span></td>
        <td>${escapeHtml(it.note)}</td>
        <td class="row-actions">
          <button class="btn sm" onclick="openItemModal(${r.idx})">수정</button>
          <button class="btn sm danger" onclick="deleteItem(${r.idx})">삭제</button>
        </td>`;
      body.appendChild(tr);
    });
  });
}

/* ===== 9) 캐릭터 CRUD ===== */
async function addCharacter(){
  const name=prompt("새 캐릭터 이름"); if(!name) return;
  const order=characters.length?Math.max(...characters.map(c=>c.order||0))+1:0;
  try{ await COL.add({name, order, items:[], updatedAt:Date.now()}); await loadAll(); }
  catch(e){ alert("추가 실패: "+e.message); }
}
async function renameCharacter(){
  const c=getCurrent(); if(!c) return;
  const name=$("detailName").value.trim(); if(!name) return;
  c.name=name; renderGrand();
  try{ await COL.doc(c.id).update({name, updatedAt:Date.now()}); }catch(e){ alert("이름 변경 실패: "+e.message); }
}
async function deleteCharacter(){
  const c=getCurrent(); if(!c) return;
  if(!confirm(`'${c.name}' 캐릭터를 삭제할까요?`)) return;
  try{ await COL.doc(c.id).delete(); currentId=null; await loadAll(); showView("list"); }
  catch(e){ alert("삭제 실패: "+e.message); }
}

/* ===== 10) 아이템 모달 ===== */
function updateTypeHints(){
  const cat=$("f_category").value;
  $("typeHints").innerHTML=(TYPE_HINTS[cat]||[]).map(t=>`<option value="${t}">`).join("");
}
function openItemModal(index){
  editingIndex=(typeof index==="number")?index:null;
  $("modalTitle").textContent= editingIndex===null ? "아이템 추가":"아이템 수정";
  if(editingIndex===null){
    $("f_category").value="무기"; $("f_type").value=""; $("f_detail").value="";
    $("f_price").value=""; $("f_status").value="보유"; $("f_note").value="";
  }else{
    const it=getCurrent().items[editingIndex];
    $("f_category").value=it.category||"무기"; $("f_type").value=it.type||"";
    $("f_detail").value=it.detail||""; $("f_price").value=it.price||"";
    $("f_status").value=it.status||"보유"; $("f_note").value=it.note||"";
  }
  updateTypeHints();
  $("itemModal").classList.add("show");
}
function closeItemModal(){ $("itemModal").classList.remove("show"); }
async function saveItem(){
  const c=getCurrent(); if(!c) return;
  const item={
    category:$("f_category").value, type:$("f_type").value.trim(),
    detail:$("f_detail").value.trim(), price:Number($("f_price").value)||0,
    status:$("f_status").value, note:$("f_note").value.trim()
  };
  if(!item.detail && !item.type){ alert("대항목 또는 소항목을 입력하세요."); return; }
  const items=(c.items||[]).slice();
  if(editingIndex===null) items.push(item); else items[editingIndex]=item;
  c.items=items; closeItemModal(); render();
  await saveCurrent();
}
async function deleteItem(index){
  const c=getCurrent(); if(!c) return;
  if(!confirm("이 아이템을 삭제할까요?")) return;
  const items=(c.items||[]).slice(); items.splice(index,1);
  c.items=items; render();
  await saveCurrent();
}
$("itemModal").addEventListener("click", e=>{ if(e.target.id==="itemModal") closeItemModal(); });
