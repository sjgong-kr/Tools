<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리니지 클래식 세력 및 일과 기록 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0d0d0d;
            color: #d1d1d1;
            background-image: radial-gradient(circle at 50% 0%, #1a1515 0%, transparent 60%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .btn-lineage { background: linear-gradient(to bottom, #5d4a36, #3b2c1f); border: 1px solid #7a634a; color: #ebdcb8; transition: all 0.2s; }
        .btn-lineage:hover { background: linear-gradient(to bottom, #6d5843, #4a3828); border-color: #8c7358; color: #fff; }
        .btn-lineage-danger { background: linear-gradient(to bottom, #6d2a2a, #4a1c1c); border: 1px solid #8a3636; color: #ffcccc; }
        .btn-lineage-danger:hover { background: linear-gradient(to bottom, #7d3333, #5a2222); }
        .input-lineage { background-color: #050505; border: 1px solid #4a3b2c; color: #d0c0a0; }
        .input-lineage:focus { outline: none; border-color: #7a634a; box-shadow: 0 0 5px rgba(122, 99, 74, 0.5); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #4a3b2c; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5d4a36; }

        /* 세력도 구조 CSS */
        .org-chart-container { 
            padding: 2rem 0; 
            width: 100%;
        }
        .tree-group { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-width: 180px; 
            margin-bottom: 2rem;
        }
        
        /* 혈맹 박스와 멤버 리스트 일체화 디자인 */
        .faction-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .faction-box { 
            width: 150px; 
            background: linear-gradient(180deg, #1c3a5e 0%, #11223a 100%); 
            border: 1px solid #3b5a88; 
            border-radius: 6px 6px 0 0; 
            padding: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .faction-box.theme-red { background: linear-gradient(180deg, #5e1c1c 0%, #3a1111 100%); border: 1px solid #8a2c2c; }
        .faction-box.theme-neutral { background: linear-gradient(180deg, #2a302a 0%, #151815 100%); border: 1px solid #4a584a; }
        .faction-box.theme-hostile { background: linear-gradient(180deg, #4a1c1c 0%, #2a0f0f 100%); border: 1px solid #6b2a2a; }
        .faction-box.theme-individual { background: linear-gradient(180deg, #222 0%, #111 100%); border: 1px solid #444; }
        
        .faction-box:hover { filter: brightness(1.2); }
        
        .connector { width: 2px; height: 12px; background: #5d4a36; }
        
        .member-list-area { 
            width: 150px; 
            background: rgba(5,5,5,0.8); 
            border: 1px solid #333; 
            border-top: none; 
            border-radius: 0 0 6px 6px; 
            padding: 8px; 
            font-size: 11px; 
            color: #aaa; 
            text-align: center; 
        }

        .line-action-btn:hover.edit { color: #ebdcb8; transform: scale(1.1); }
        .line-action-btn:hover.delete { color: #ff6b6b; transform: scale(1.1); }
        
        .emblem-upload-area { cursor: pointer; position: relative; }
        .emblem-upload-area::after { content: '변경'; position: absolute; inset: 0; background: rgba(0,0,0,0.7); color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; border-radius: inherit; }
        .emblem-upload-area:hover::after { opacity: 1; }
        
        /* 캡처 모드 최적화 (글씨 잘림 방지 및 UI 숨김) */
        .capture-mode .hide-on-capture { display: none !important; }
        .capture-mode { 
            padding: 40px !important; 
            background-color: #0f0f0f !important;
            width: max-content !important; /* 캡처 시 내부 컨텐츠 크기만큼 확장되어 잘림 방지 */
            min-width: 100%;
        }
        .capture-mode .truncate { white-space: normal; overflow: visible; } /* 말줄임표 해제 */
    </style>
</head>
<body class="p-2 md:p-6 text-sm">

    <div class="max-w-[1500px] mx-auto">
        <header class="mb-6 flex flex-col md:flex-row justify-between items-end border-b border-[#333] pb-4">
            <div>
                <h1 class="text-3xl font-black text-[#ebdcb8] tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                    LINEAGE CLASSIC
                </h1>
                <h2 class="text-gray-400 font-medium tracking-wide mt-1">세력 구도 및 일과 기록 시스템 (Firebase 연동)</h2>
            </div>
            <div class="flex flex-col items-end gap-2 mt-4 md:mt-0">
                <div class="flex gap-2 mb-1 flex-wrap justify-end items-center">
                    <button onclick="captureOrgChart()" class="bg-[#2c4a2c] hover:bg-[#3a653a] text-white px-3 py-1.5 rounded text-xs border border-[#4a8a4a] transition-colors flex items-center gap-1 font-bold">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        📸 세력도 이미지 캡처
                    </button>
                    <button onclick="exportData()" class="bg-[#1c2e4a] hover:bg-[#2a4365] text-white px-3 py-1.5 rounded text-xs border border-[#2c588a] transition-colors flex items-center gap-1">
                        데이터 백업(JSON)
                    </button>
                    <label class="bg-[#4a2e1c] hover:bg-[#65432a] text-white px-3 py-1.5 rounded text-xs border border-[#8a582c] transition-colors cursor-pointer flex items-center gap-1">
                        데이터 복원 <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                    </label>
                </div>
                
                <div class="flex gap-4 text-right">
                    <div>
                        <div class="text-gray-500 text-xs">총 세력</div>
                        <div class="text-xl font-bold text-[#ebdcb8]" id="total-factions">0</div>
                    </div>
                    <div>
                        <div class="text-gray-500 text-xs">총 인원</div>
                        <div class="text-xl font-bold text-[#ebdcb8]" id="total-members">0</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 새로운 세력 창설 폼 -->
        <details class="bg-[#1a1a1a] border border-[#333] rounded-lg mb-8 group" open>
            <summary class="p-4 cursor-pointer font-semibold text-[#ebdcb8] list-none flex justify-between items-center bg-[#222] rounded-t-lg">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2 text-[#8c7358]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    새로운 혈맹 창설 (열기/닫기)
                </div>
            </summary>
            <div class="p-5 border-t border-[#333]">
                <form id="faction-form" class="flex flex-wrap gap-4 items-end">
                    <div class="w-full md:w-auto flex-grow">
                        <label class="block text-xs text-gray-400 mb-1">혈마크 이미지</label>
                        <input type="file" id="faction-emblem" accept="image/*" class="input-lineage w-full px-2 py-1.5 rounded text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-[#3b2c1f] file:text-[#ebdcb8] hover:file:bg-[#4a3828]">
                    </div>
                    <div class="w-full md:w-56">
                        <label class="block text-xs text-gray-400 mb-1">소속 그룹 (키워드 자동분류: 중립, 적대, 개인)</label>
                        <input type="text" id="faction-line" placeholder="예: 천하라인, 중립 등" required class="input-lineage w-full px-3 py-2 rounded">
                    </div>
                    <div class="w-full md:w-48">
                        <label class="block text-xs text-gray-400 mb-1">혈맹 이름</label>
                        <input type="text" id="faction-name" placeholder="예: 천하" required class="input-lineage w-full px-3 py-2 rounded">
                    </div>
                    <button type="submit" class="btn-lineage px-6 py-2 rounded font-medium h-[38px] w-full md:w-auto">창설</button>
                </form>
            </div>
        </details>

        <!-- 조직도 시각화 영역 (가로 스크롤 허용) -->
        <div class="overflow-x-auto custom-scrollbar border border-[#222] rounded-xl shadow-2xl bg-[#0f0f0f]">
            <div id="org-chart-wrapper" class="flex flex-col w-full min-h-[400px]">
                <div class="p-20 text-center text-gray-600">Firebase에서 데이터를 불러오는 중입니다...</div>
            </div>
        </div>
    </div>

    <!-- 혈맹 상세 및 길드원 관리 모달 -->
    <div id="faction-detail-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4">
        <div class="bg-[#151515] border border-[#4a3b2c] rounded-lg w-full max-w-5xl h-[85vh] md:h-[75vh] flex flex-col md:flex-row relative shadow-[0_0_30px_rgba(0,0,0,1)]">
            <button onclick="closeFactionDetail()" class="absolute top-3 right-3 text-gray-400 hover:text-white z-20 bg-black/50 rounded-full p-1 border border-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <!-- 좌측: 혈맹 정보 및 기록장 -->
            <div class="w-full md:w-[45%] bg-[#1a1a1a] flex flex-col border-b md:border-b-0 md:border-r border-[#333] z-10 overflow-y-auto custom-scrollbar">
                <div class="p-6 bg-gradient-to-b from-[#252525] to-[#1a1a1a] border-b border-[#333]">
                    <div class="flex items-center gap-3 mb-2">
                        <input type="file" id="detail-emblem-upload" accept="image/*" class="hidden" onchange="updateFactionEmblem(event)">
                        <div id="detail-header-top" class="flex items-center gap-3"></div>
                    </div>
                    <h2 class="text-3xl font-black text-[#ebdcb8] drop-shadow-md" id="detail-name">혈맹이름</h2>
                    <div class="text-gray-400 text-sm mt-1">창설/등록일: <span id="detail-date">-</span></div>
                </div>
                
                <div class="p-6 flex-grow flex flex-col gap-4">
                    <!-- 소속 이동 영역 추가 -->
                    <div class="bg-[#222] p-3 rounded border border-[#333]">
                        <label class="block text-xs text-gray-400 mb-1">소속 라인 이동 (변경 시 즉시 이동)</label>
                        <div class="flex gap-2">
                            <input type="text" id="detail-line-input" class="input-lineage w-full px-3 py-1.5 rounded text-sm flex-grow">
                            <button onclick="moveFactionLine()" class="bg-[#2c4a2c] hover:bg-[#3a653a] text-white px-3 py-1.5 rounded text-sm font-bold whitespace-nowrap border border-[#4a8a4a]">이동</button>
                        </div>
                    </div>

                    <div class="flex-grow flex flex-col">
                        <label class="block text-sm font-semibold text-[#8c7358] mb-2 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            기타 내역 및 일과 기록장
                        </label>
                        <textarea id="detail-desc-input" class="input-lineage w-full p-4 rounded flex-grow resize-none text-sm leading-relaxed" placeholder="이 혈맹과 관련된 주요 사건, 적대 변동, 오늘의 주요 일과 등을 자유롭게 기록하세요."></textarea>
                    </div>
                    
                    <div class="flex gap-2 mt-2">
                        <button onclick="saveFactionDesc()" class="btn-lineage flex-grow py-2 rounded font-medium">기록장 저장</button>
                        <button onclick="deleteCurrentFaction()" class="btn-lineage-danger px-4 py-2 rounded hover:bg-red-900 transition-colors" title="혈맹 개별 삭제">혈맹 삭제</button>
                    </div>
                </div>
            </div>
            
            <!-- 우측: 길드원 관리 -->
            <div class="w-full md:w-[55%] p-6 flex flex-col bg-[#111]">
                <div class="flex justify-between items-end mb-4 border-b border-[#333] pb-2">
                    <h3 class="text-xl font-bold text-[#ebdcb8]">길드원 명단</h3>
                    <span class="bg-[#222] border border-[#444] px-3 py-1 rounded-full text-xs text-gray-300">
                        총 <span id="detail-member-count" class="text-white font-bold">0</span>명
                    </span>
                </div>
                
                <form id="member-add-form" class="flex gap-2 mb-4 bg-[#1a1a1a] p-3 rounded border border-[#2a2a2a] shadow-inner items-center">
                    <input type="text" id="mem-name" placeholder="캐릭터명" required class="input-lineage w-1/4 px-3 py-1.5 rounded text-sm">
                    <select id="mem-class" class="input-lineage w-1/4 px-2 py-1.5 rounded text-sm">
                        <option value="군주">군주</option><option value="기사">기사</option><option value="요정">요정</option>
                        <option value="마법사">마법사</option><option value="다크엘프">다크엘프</option><option value="용기사">용기사</option><option value="환술사">환술사</option>
                    </select>
                    <input type="number" id="mem-level" placeholder="Lv" required min="1" max="99" class="input-lineage w-16 px-2 py-1.5 rounded text-sm text-center">
                    <input type="text" id="mem-role" placeholder="직책/메모" class="input-lineage flex-grow px-3 py-1.5 rounded text-sm hidden md:block">
                    <button type="submit" id="mem-submit-btn" class="btn-lineage px-4 py-1.5 rounded text-sm whitespace-nowrap font-bold">추가</button>
                    <button type="button" id="mem-cancel-btn" onclick="cancelEditMember()" class="hidden bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm whitespace-nowrap border border-gray-600 transition-colors">취소</button>
                </form>
                
                <div class="flex-grow overflow-y-auto custom-scrollbar pr-2">
                    <div id="detail-member-list" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 알림 메시지 컨테이너 -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[60] flex flex-col gap-2"></div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // ==========================================
        // 🔥 Firebase 설정 (제공해주신 Key 정보)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBD5-AJDFJKsneHyqH70SlNU9VixDAHl3o",
            authDomain: "openzeroc.firebaseapp.com",
            projectId: "openzeroc",
            storageBucket: "openzeroc.firebasestorage.app",
            messagingSenderId: "465944510778",
            appId: "1:465944510778:web:df0d19b7c6b98d129f5003",
            measurementId: "G-M4K79K2XPG"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // 전역 상태 변수
        window.factions = [];
        window.currentEditingFactionId = null;
        window.currentEditingMemberId = null;

        const classColors = {
            '군주': 'text-yellow-400', '기사': 'text-red-400', '요정': 'text-green-400',
            '마법사': 'text-blue-400', '다크엘프': 'text-purple-400', '용기사': 'text-orange-400', '환술사': 'text-pink-400'
        };

        const factionForm = document.getElementById('faction-form');
        const orgChartWrapper = document.getElementById('org-chart-wrapper');
        const detailModal = document.getElementById('faction-detail-modal');
        const memberAddForm = document.getElementById('member-add-form');
        const toastContainer = document.getElementById('toast-container');

        // --- Firebase 실시간 동기화 (로그인 없이) ---
        onSnapshot(doc(db, "lineage_area", "main_data"), (docSnap) => {
            if (docSnap.exists()) {
                window.factions = docSnap.data().factions || [];
            } else {
                window.factions = [];
            }
            window.renderOrgChart();
        }, (error) => {
            console.error("Firestore 규칙 또는 연결 오류:", error);
            showToast("데이터베이스 권한 오류. Firestore 규칙(Rule) 설정을 확인해주세요.", true);
            window.renderOrgChart(); 
        });

        async function saveToFirebase() {
            try {
                await setDoc(doc(db, "lineage_area", "main_data"), { factions: window.factions });
            } catch (error) {
                console.error("저장 실패:", error);
                showToast('Firebase 저장 권한이 없습니다.', true);
            }
        }

        function updateStats() {
            document.getElementById('total-factions').textContent = window.factions.length;
            const totalMembers = window.factions.reduce((sum, f) => sum + f.members.length, 0);
            document.getElementById('total-members').textContent = totalMembers;
        }

        window.showToast = function(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-md shadow-2xl text-white text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 ${isError ? 'bg-[#7d2222] border border-[#a33]' : 'bg-[#2a4365] border border-[#4299e1]'}`;
            toast.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isError ? 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' : 'M5 13l4 4L19 7'}"></path></svg> ${message}`;
            toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        function processImageToBase64(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 32; canvas.height = 32;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, 32, 32);
                        ctx.drawImage(img, 0, 0, 32, 32);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        // --- 기능: 라인/혈맹 생성 및 수정 ---

        factionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = factionForm.querySelector('button');
            btn.disabled = true; btn.textContent = '처리 중...';

            const line = document.getElementById('faction-line').value.trim();
            const name = document.getElementById('faction-name').value.trim();
            const file = document.getElementById('faction-emblem').files[0];

            if (window.factions.some(f => f.name === name)) {
                showToast('이미 존재하는 혈맹 이름입니다.', true);
                btn.disabled = false; btn.textContent = '창설';
                return;
            }

            const emblem = await processImageToBase64(file);
            window.factions.push({
                id: generateId(), line: line || '무소속', name: name, description: '',
                emblem: emblem, createdAt: new Date().toLocaleDateString(), members: []
            });

            window.renderOrgChart(); 
            saveToFirebase().then(() => {
                factionForm.reset();
                btn.disabled = false; btn.textContent = '창설';
                showToast(`[${name}] 혈맹이 등록되었습니다.`);
            });
        });

        window.editLineName = function(oldLineName) {
            const newLineName = prompt(`'${oldLineName}'의 새로운 라인 이름을 입력하세요:`, oldLineName);
            if (newLineName && newLineName.trim() !== '' && newLineName !== oldLineName) {
                const trimmedName = newLineName.trim();
                window.factions.forEach(f => { if (f.line === oldLineName) f.line = trimmedName; });
                window.renderOrgChart(); 
                saveToFirebase();
                showToast(`라인명이 [${trimmedName}](으)로 변경되었습니다.`);
            }
        };

        window.deleteLine = function(lineName) {
            const factionsInLine = window.factions.filter(f => f.line === lineName);
            if (factionsInLine.length === 0) return;
            if (confirm(`⚠️ 경고: [${lineName}] 라인을 정말 삭제하시겠습니까?\n\n소속된 혈맹과 길드원이 모두 삭제됩니다.`)) {
                window.factions = window.factions.filter(f => f.line !== lineName);
                window.renderOrgChart(); 
                saveToFirebase();
                showToast(`[${lineName}] 라인이 삭제되었습니다.`, true);
            }
        };

        // UI 렌더링 헬퍼 (일체형 카드 디자인 적용)
        function createTreeGroupHTML(lineName, factionsInLine, themeType) {
            let headerBg, themeClass;
            if (themeType === 0) { headerBg = 'from-[#1c3a5e] to-[#11223a] border-[#2c588a]'; themeClass = ''; } 
            else if (themeType === 1) { headerBg = 'from-[#5e1c1c] to-[#3a1111] border-[#8a2c2c]'; themeClass = 'theme-red'; } 
            else if (themeType === 2) { headerBg = 'from-[#2a302a] to-[#151815] border-[#4a584a]'; themeClass = 'theme-neutral'; }
            else if (themeType === 3) { headerBg = 'from-[#4a1c1c] to-[#2a0f0f] border-[#6b2a2a]'; themeClass = 'theme-hostile'; }
            else { headerBg = 'from-[#222] to-[#111] border-[#444]'; themeClass = 'theme-individual'; }

            // flex-wrap을 적용하여 박스들이 자연스럽게 줄바꿈 되도록 설정
            let html = `
                <div class="tree-group">
                    <div class="bg-gradient-to-r ${headerBg} border-2 rounded px-8 py-2.5 text-center shadow-[0_0_15px_rgba(0,0,0,0.5)] z-10 relative group flex items-center gap-2 mb-6">
                        <h2 class="text-xl font-bold text-white tracking-widest drop-shadow-md whitespace-nowrap">${lineName}</h2>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity ml-1 flex gap-1 bg-black/30 px-1 py-0.5 rounded hide-on-capture">
                            <button onclick="editLineName('${lineName}')" class="line-action-btn edit text-gray-400 p-0.5" title="라인명 수정"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                            <button onclick="deleteLine('${lineName}')" class="line-action-btn delete text-gray-400 p-0.5" title="라인 통째로 삭제"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                    <div class="flex flex-wrap justify-center gap-6 px-4">
            `;

            factionsInLine.forEach(faction => {
                const emblemHTML = faction.emblem 
                    ? `<img src="${faction.emblem}" class="w-7 h-7 mx-auto mb-1 border border-[#5d4a36] rounded-sm object-cover bg-black">` 
                    : `<div class="w-7 h-7 mx-auto mb-1 bg-[#111] border border-[#5d4a36] rounded-sm flex items-center justify-center text-[10px] text-gray-600 font-bold">無</div>`;

                html += `
                    <div class="faction-container">
                        <div class="faction-box ${themeClass}" onclick="openFactionDetail('${faction.id}')">
                            ${emblemHTML}
                            <div class="font-bold text-[#ebdcb8] text-sm mt-1 w-full text-center truncate px-1">${faction.name}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5 hide-on-capture">인원: ${faction.members.length}명</div>
                        </div>
                        <div class="connector hide-on-capture"></div>
                        <div class="member-list-area hide-on-capture">
                `;
                
                const previewMembers = faction.members.slice(0, 10);
                if(previewMembers.length === 0) {
                    html += `<span class="opacity-50">-</span>`;
                } else {
                    previewMembers.forEach(m => {
                        const color = classColors[m.class] || 'text-gray-400';
                        html += `<div class="truncate text-[12px]"><span class="${color} font-medium">${m.name}</span> <span class="text-[9px] text-gray-500">Lv${m.level}</span></div>`;
                    });
                    if (faction.members.length > 10) html += `<div class="text-[11px] text-gray-500 mt-1 pt-1 border-t border-[#333]">외 ${faction.members.length - 10}명</div>`;
                }
                html += `</div></div>`;
            });

            html += `</div></div>`;
            return html;
        }

        window.renderOrgChart = function() {
            updateStats();

            if (window.factions.length === 0) {
                orgChartWrapper.innerHTML = `<div class="p-20 text-center text-gray-600">등록된 세력이 없습니다. 위 폼을 통해 혈맹을 등록하세요.</div>`;
                return;
            }

            const combatGroups = {};
            const neutralGroups = {};
            const hostileGroups = {};
            const individualGroups = {};

            window.factions.forEach(f => {
                const lineName = f.line;
                if (lineName.includes('중립')) {
                    if (!neutralGroups[lineName]) neutralGroups[lineName] = [];
                    neutralGroups[lineName].push(f);
                } else if (lineName.includes('적대')) {
                    if (!hostileGroups[lineName]) hostileGroups[lineName] = [];
                    hostileGroups[lineName].push(f);
                } else if (lineName.includes('개인') || lineName.includes('무소속')) {
                    if (!individualGroups[lineName]) individualGroups[lineName] = [];
                    individualGroups[lineName].push(f);
                } else {
                    if (!combatGroups[lineName]) combatGroups[lineName] = [];
                    combatGroups[lineName].push(f);
                }
            });

            let html = '';

            // 전투 라인 (VS)
            const combatNames = Object.keys(combatGroups);
            if (combatNames.length > 0) {
                html += `<div class="org-chart-container flex flex-wrap justify-center gap-x-12 gap-y-8 pb-8">`;
                combatNames.forEach((lineName, index) => {
                    const themeType = index % 2 === 0 ? 0 : 1; 
                    html += createTreeGroupHTML(lineName, combatGroups[lineName], themeType);

                    if (combatNames.length === 2 && index === 0) {
                        html += `<div class="flex flex-col items-center pt-8 flex-shrink-0"><div class="text-4xl md:text-5xl font-black text-[#4a3b2c] italic drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">VS</div></div>`;
                    }
                });
                html += `</div>`;
            }

            // 적대 라인
            const hostileNames = Object.keys(hostileGroups);
            if (hostileNames.length > 0) {
                const borderTop = combatNames.length > 0 ? 'border-t border-[#333]' : '';
                html += `
                    <div class="w-full ${borderTop} bg-[#1a0f0f] pt-8 pb-12">
                        <div class="text-center mb-6"><h3 class="inline-block px-4 py-1 border border-[#6b2a2a] rounded-full text-lg font-bold text-[#e67373] bg-[#2a0f0f]">⚔️ 적대 혈맹</h3></div>
                        <div class="org-chart-container flex flex-wrap justify-center gap-8 pt-2 min-h-0">
                `;
                hostileNames.forEach(lineName => { html += createTreeGroupHTML(lineName, hostileGroups[lineName], 3); });
                html += `</div></div>`;
            }

            // 중립 라인
            const neutralNames = Object.keys(neutralGroups);
            if (neutralNames.length > 0) {
                const borderTop = (combatNames.length > 0 || hostileNames.length > 0) ? 'border-t border-[#333]' : '';
                html += `
                    <div class="w-full ${borderTop} bg-[#141414] pt-8 pb-12">
                        <div class="text-center mb-6"><h3 class="inline-block px-4 py-1 border border-[#4a584a] rounded-full text-lg font-bold text-[#8ba38b] bg-[#1a201a]">🏳️ 중립 혈맹</h3></div>
                        <div class="org-chart-container flex flex-wrap justify-center gap-8 pt-2 min-h-0">
                `;
                neutralNames.forEach(lineName => { html += createTreeGroupHTML(lineName, neutralGroups[lineName], 2); });
                html += `</div></div>`;
            }

            // 개인/무소속 라인
            const individualNames = Object.keys(individualGroups);
            if (individualNames.length > 0) {
                const borderTop = (combatNames.length > 0 || hostileNames.length > 0 || neutralNames.length > 0) ? 'border-t border-[#333]' : '';
                html += `
                    <div class="w-full ${borderTop} bg-[#111111] pt-8 pb-12">
                        <div class="text-center mb-6"><h3 class="inline-block px-4 py-1 border border-[#444] rounded-full text-lg font-bold text-[#aaa] bg-[#222]">👤 개인 및 무소속</h3></div>
                        <div class="org-chart-container flex flex-wrap justify-center gap-8 pt-2 min-h-0">
                `;
                individualNames.forEach(lineName => { html += createTreeGroupHTML(lineName, individualGroups[lineName], 4); });
                html += `</div></div>`;
            }

            orgChartWrapper.innerHTML = html;
        }

        // --- 상세 관리 모달 로직 ---
        window.openFactionDetail = function(factionId) {
            const faction = window.factions.find(f => f.id === factionId);
            if(!faction) return;

            window.currentEditingFactionId = faction.id;

            const emblemHTML = faction.emblem 
                ? `<img src="${faction.emblem}" class="w-8 h-8 border border-[#5d4a36] rounded object-cover shadow emblem-upload-area" onclick="document.getElementById('detail-emblem-upload').click()" title="클릭하여 마크 변경">` 
                : `<div class="w-8 h-8 bg-black border border-[#5d4a36] rounded flex items-center justify-center text-xs text-gray-500 font-bold emblem-upload-area" onclick="document.getElementById('detail-emblem-upload').click()" title="클릭하여 마크 등록">無</div>`;
            
            document.getElementById('detail-header-top').innerHTML = `${emblemHTML} <span class="bg-[#332] text-[#d0c0a0] border border-[#5a4a3a] px-2 py-0.5 rounded text-xs font-bold">${faction.line}</span>`;
            document.getElementById('detail-name').textContent = faction.name;
            document.getElementById('detail-date').textContent = faction.createdAt || '-';
            
            // 라인 및 설명 인풋 설정
            document.getElementById('detail-line-input').value = faction.line || '';
            document.getElementById('detail-desc-input').value = faction.description || '';

            memberAddForm.reset();
            renderDetailMembers(faction);

            detailModal.classList.remove('hidden');
            detailModal.classList.add('flex');
            setTimeout(() => {
                detailModal.children[0].classList.add('scale-100', 'opacity-100');
                detailModal.children[0].classList.remove('scale-95', 'opacity-0');
            }, 10);
        };

        window.closeFactionDetail = function() {
            detailModal.classList.add('hidden');
            detailModal.classList.remove('flex');
            window.currentEditingFactionId = null;
            document.getElementById('detail-emblem-upload').value = ''; 
            cancelEditMember(); 
        };

        window.updateFactionEmblem = async function(event) {
            const file = event.target.files[0];
            if (!file || !window.currentEditingFactionId) return;

            const faction = window.factions.find(f => f.id === window.currentEditingFactionId);
            if(faction) {
                faction.emblem = await processImageToBase64(file);
                window.renderOrgChart(); 
                saveToFirebase(); 
                openFactionDetail(faction.id); 
                showToast('마크가 교체되었습니다.');
            }
        }; 

        // [신규 기능] 혈맹 소속 라인 이동
        window.moveFactionLine = function() {
            if(!window.currentEditingFactionId) return;
            const faction = window.factions.find(f => f.id === window.currentEditingFactionId);
            const newLine = document.getElementById('detail-line-input').value.trim();
            
            if(newLine === '') {
                showToast('이동할 소속 라인 이름을 입력해주세요.', true);
                return;
            }

            faction.line = newLine;
            window.renderOrgChart();
            saveToFirebase();
            openFactionDetail(faction.id); // 상단 라인 배지 리프레시
            showToast(`[${faction.name}] 혈맹이 [${newLine}](으)로 이동되었습니다.`);
        };

        window.saveFactionDesc = function() {
            if(!window.currentEditingFactionId) return;
            const faction = window.factions.find(f => f.id === window.currentEditingFactionId);
            faction.description = document.getElementById('detail-desc-input').value;
            saveToFirebase();
            showToast('일과 기록이 저장되었습니다.');
        };

        // --- 멤버 관리 로직 ---
        memberAddForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if(!window.currentEditingFactionId) return;
            
            const faction = window.factions.find(f => f.id === window.currentEditingFactionId);
            const name = document.getElementById('mem-name').value.trim();
            const charClass = document.getElementById('mem-class').value;
            const level = parseInt(document.getElementById('mem-level').value);
            const role = document.getElementById('mem-role').value.trim();

            if (window.currentEditingMemberId) {
                const member = faction.members.find(m => m.id === window.currentEditingMemberId);
                if (member) {
                    if (member.name !== name && faction.members.some(m => m.name === name)) {
                        showToast('이미 등록된 캐릭터 이름입니다.', true); return;
                    }
                    member.name = name; member.class = charClass; member.level = level; member.role = role;
                    showToast('캐릭터 정보가 수정되었습니다.');
                }
            } else {
                if (faction.members.some(m => m.name === name)) {
                    showToast('이미 등록된 캐릭터입니다.', true); return;
                }
                faction.members.push({ id: generateId(), name, class: charClass, level, role });
                showToast(`${name} 캐릭터 추가 완료.`);
            }

            faction.members.sort((a, b) => {
                if (a.class === '군주' && b.class !== '군주') return -1;
                if (b.class === '군주' && a.class !== '군주') return 1;
                return b.level - a.level;
            });

            renderDetailMembers(faction); 
            window.renderOrgChart(); 
            saveToFirebase(); 
            
            cancelEditMember();
            document.getElementById('mem-name').focus();
        });

        window.editMember = function(memberId) {
            const faction = window.factions.find(f => f.id === window.currentEditingFactionId);
            if (!faction) return;
            const member = faction.members.find(m => m.id === memberId);
            if (!member) return;

            window.currentEditingMemberId = member.id;
            document.getElementById('mem-name').value = member.name;
            document.getElementById('mem-class').value = member.class;
            document.getElementById('mem-level').value = member.level;
            document.getElementById('mem-role').value = member.role || '';
            
            document.getElementById('mem-submit-btn').textContent = '수정 완료';
            document.getElementById('mem-submit-btn').style.background = 'linear-gradient(to bottom, #2b4c7e, #1a2a47)';
            document.getElementById('mem-cancel-btn').classList.remove('hidden');
        };

        window.cancelEditMember = function() {
            window.currentEditingMemberId = null;
            memberAddForm.reset();
            document.getElementById('mem-submit-btn').textContent = '추가';
            document.getElementById('mem-submit-btn').style.background = ''; 
            document.getElementById('mem-cancel-btn').classList.add('hidden');
        };

        function renderDetailMembers(faction) {
            document.getElementById('detail-member-count').textContent = faction.members.length;
            const listEl = document.getElementById('detail-member-list');
            if(faction.members.length === 0) {
                listEl.innerHTML = `<div class="col-span-full text-center py-10 text-gray-600 border border-dashed border-gray-800 rounded">등록된 캐릭터가 없습니다.</div>`; return;
            }

            let html = '';
            faction.members.forEach((m, idx) => {
                const color = classColors[m.class] || 'text-gray-300';
                const isLeader = m.class === '군주';
                const borderClass = isLeader ? 'border-[#5a432b] bg-[#1a1612]' : 'border-[#222] bg-[#151515]';

                html += `
                    <div class="flex justify-between items-center p-2 rounded border ${borderClass} hover:border-[#444] transition-colors group">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <div class="text-[10px] text-gray-600 w-4 text-right">${idx + 1}</div>
                            <div class="flex flex-col">
                                <div class="flex items-baseline gap-1">
                                    <span class="text-sm ${isLeader ? 'font-bold text-yellow-300' : 'text-gray-200'} truncate max-w-[80px]" title="${m.name}">${m.name}</span>
                                    <span class="text-[10px] ${color}">[${m.class}]</span>
                                </div>
                                <div class="flex items-center gap-1.5 text-[11px]">
                                    <span class="text-gray-400">Lv.${m.level}</span>
                                    ${m.role ? `<span class="text-[#8c7358] truncate max-w-[60px]" title="${m.role}">${m.role}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-1 opacity-20 group-hover:opacity-100 transition-all">
                            <button onclick="editMember('${m.id}')" class="text-gray-500 hover:text-[#ebdcb8] p-1" title="수정">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button onclick="removeMember('${m.id}')" class="text-gray-600 hover:text-red-500 p-1" title="삭제">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        window.removeMember = function(memberId) {
            if(!window.currentEditingFactionId) return;
            const faction = window.factions.find(f => f.id === window.currentEditingFactionId);
            if(confirm('캐릭터를 삭제하시겠습니까?')) {
                faction.members = faction.members.filter(m => m.id !== memberId);
                renderDetailMembers(faction); 
                window.renderOrgChart();
                saveToFirebase(); 
            }
        };

        window.deleteCurrentFaction = function() {
            if(!window.currentEditingFactionId) return;
            const faction = window.factions.find(f => f.id === window.currentEditingFactionId);
            if(confirm(`[${faction.name}] 혈맹을 기록에서 완전히 삭제하시겠습니까?`)) {
                window.factions = window.factions.filter(f => f.id !== window.currentEditingFactionId);
                window.renderOrgChart(); 
                saveToFirebase(); 
                closeFactionDetail();
                showToast(`삭제 완료되었습니다.`, true);
            }
        };

        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) closeFactionDetail();
        });

        // 캡처 최적화 기능
        window.captureOrgChart = async function() {
            if (typeof html2canvas === 'undefined') {
                showToast('캡처 라이브러리 로딩 중입니다. 잠시 후 시도해주세요.', true); return;
            }
            const wrapper = document.getElementById('org-chart-wrapper');
            const originalBg = wrapper.style.backgroundColor;
            
            // 캡처 전용 클래스 부여 (컨테이너 확장, truncate 말줄임 해제, 하위 명단 등 숨김)
            wrapper.classList.add('capture-mode');
            
            try {
                showToast('고해상도로 세력도를 캡처하고 있습니다...', false);
                await new Promise(resolve => setTimeout(resolve, 300)); // 렌더링 대기 시간 약간 증가
                
                const canvas = await html2canvas(wrapper, { 
                    backgroundColor: '#0f0f0f', 
                    scale: 2, // 고해상도 옵션
                    useCORS: true, 
                    logging: false,
                    windowWidth: wrapper.scrollWidth, // 캡처 시 실제 컨텐츠 넓이 강제 지정하여 잘림 방지
                    windowHeight: wrapper.scrollHeight 
                });
                
                const link = document.createElement('a');
                link.download = `리니지클래식_세력도_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                console.error(error); showToast('캡처 오류 발생', true);
            } finally {
                wrapper.classList.remove('capture-mode'); 
                wrapper.style.backgroundColor = originalBg;
            }
        };

        // 데이터 백업 기능
        window.exportData = function() {
            if (window.factions.length === 0) return showToast('내보낼 데이터가 없습니다.', true);
            const dataStr = JSON.stringify(window.factions, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', `lineage_record_${new Date().toISOString().slice(0,10)}.json`);
            linkElement.click();
            showToast('데이터를 성공적으로 백업했습니다.');
        };

        window.importData = async function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm('기존 데이터를 덮어쓰고 복원하시겠습니까? (Firebase에도 동기화됩니다)')) {
                            window.factions = importedData;
                            window.renderOrgChart(); 
                            await saveToFirebase(); 
                            showToast('복원 및 서버 동기화 완료!');
                        }
                    } else { showToast('올바르지 않은 백업 파일입니다.', true); }
                } catch (error) { showToast('오류 발생.', true); }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        };
    </script>
</body>
</html>
