<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작가님의 일일 업무 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f3f4f6; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .view-section { display: none; }
        .view-section.active-flex { display: flex; }
        .view-section.active-block { display: block; }
        
        .loader { 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #6366f1; 
            border-radius: 50%; 
            width: 24px; 
            height: 24px; 
            animation: spin 1s linear infinite; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-gray-800 relative bg-gray-50">

    <!-- ==========================================
         [1] 로그인 화면
    ========================================== -->
    <div id="login-view" class="fixed inset-0 flex flex-col items-center justify-center bg-gray-50 z-50 p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 p-8 fade-in">
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Studio 로그</h1>
                <p class="text-sm text-gray-500 mt-2" id="auth-subtitle">오늘도 마감 화이팅! 작업실에 오신 것을 환영합니다.</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">이메일 계정</label>
                    <input type="email" id="auth-email" required placeholder="예: webtoon@naver.com" 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                    <input type="password" id="auth-password" required placeholder="6자리 이상 입력" 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                </div>
                
                <div id="auth-error-msg" class="text-red-500 text-sm font-bold text-center hidden bg-red-50 py-2 rounded-lg mt-2"></div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 mt-6">
                    <span id="auth-submit-text">작업실 입장하기 (로그인)</span>
                    <div id="auth-submit-loader" class="loader !w-4 !h-4 !border-[2px] hidden border-t-white border-white/30"></div>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                <span id="auth-toggle-text">처음 오셨나요?</span> 
                <button type="button" onclick="window.toggleAuthMode()" class="text-indigo-600 font-bold hover:underline ml-1" id="auth-toggle-btn">회원가입하기</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         [2] 메인 앱 화면 (로그인 성공 시 표시)
    ========================================== -->
    <div id="app-view" class="h-screen w-full flex overflow-hidden relative hidden">
        
        <!-- 사이드바 -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex z-20">
            <div class="p-6 border-b border-gray-200 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xl">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg">Studio 로그</h1>
                    <p class="text-xs text-gray-500 flex items-center gap-1">
                        <span id="sync-status" class="w-2 h-2 rounded-full bg-green-500 inline-block"></span> 
                        <span id="sync-text">서버 연결됨</span>
                    </p>
                </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" onclick="window.switchView('dashboard')" id="nav-dashboard" class="flex items-center gap-3 px-4 py-3 bg-indigo-50 text-indigo-600 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-calendar-day"></i> 오늘 일정
                </a>
                <a href="#" onclick="window.switchView('all-tasks')" id="nav-all-tasks" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-list-check"></i> 전체 업무
                </a>
                <a href="#" onclick="window.switchView('statistics')" id="nav-statistics" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-chart-pie"></i> 작업 통계
                </a>
            </nav>

            <div class="p-4 border-t border-gray-200 bg-gray-50">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-sm shrink-0">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs text-gray-500 font-medium">로그인된 계정</p>
                            <p class="text-sm font-bold text-gray-800 truncate" id="user-email-display">user@email.com</p>
                        </div>
                    </div>
                </div>
                <button onclick="window.handleLogout()" class="w-full flex items-center justify-center gap-2 py-2 px-3 bg-white border border-gray-200 hover:bg-gray-100 text-gray-600 rounded-lg text-sm font-medium transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
                </button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50/50">
            
            <!-- 상단 헤더 -->
            <header class="bg-white p-6 border-b border-gray-200 flex justify-between items-center z-10 shadow-sm shrink-0">
                <div class="flex items-center gap-4">
                    <button onclick="window.openMonthPicker()" class="flex items-center gap-2 text-lg font-bold text-gray-800 bg-gray-50 border border-gray-200 rounded-lg px-4 py-1.5 hover:border-indigo-300 hover:bg-indigo-50 transition-colors">
                        <span id="header-month-display">2026년 3월</span>
                        <i class="fa-solid fa-caret-down text-sm text-gray-400"></i>
                    </button>
                    
                    <div class="flex gap-1">
                        <button onclick="window.changeMonth(-1)" class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="이전 달"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="window.resetToToday()" class="px-3 py-1.5 text-sm font-bold text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors border border-indigo-200 bg-indigo-50/50 shadow-sm">오늘</button>
                        <button onclick="window.changeMonth(1)" class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="다음 달"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="window.openCategoryManager()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-tags"></i> 분류 관리
                    </button>
                    <button onclick="window.openTaskModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-bold shadow-sm transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> 업무 추가
                    </button>
                </div>
            </header>

            <!-- ==================== 뷰: 대시보드 ==================== -->
            <div id="view-dashboard" class="view-section active-flex flex-1 overflow-y-auto p-6 flex-col xl:flex-row gap-6">
                <!-- 좌측 영역 -->
                <div class="flex-1 flex flex-col gap-6 min-w-0">
                    
                    <!-- 달력 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col shrink-0">
                        <div class="grid grid-cols-7 gap-2 mb-2 text-center text-sm font-bold text-gray-400">
                            <div class="text-red-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-400">토</div>
                        </div>
                        <div id="calendar-grid" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr min-h-[300px]"></div>
                    </div>

                    <!-- 주간 예정 사항 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex-1 min-h-[250px] flex flex-col">
                        <div class="flex justify-between items-center mb-4 border-b pb-3 shrink-0">
                            <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2 cursor-pointer hover:text-indigo-600 transition-colors group" onclick="window.openWeekPicker()">
                                <i class="fa-solid fa-calendar-week text-indigo-500"></i>
                                <span id="weekly-week-number">주간 일정</span>
                                <i class="fa-solid fa-caret-down text-sm text-gray-400 group-hover:text-indigo-600 ml-0.5"></i>
                            </h3>
                            <div class="flex items-center gap-2">
                                <button onclick="window.changeWeek(-1)" class="w-7 h-7 flex items-center justify-center rounded bg-gray-100 text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 transition-colors"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                <span class="text-sm font-medium text-gray-600 min-w-[90px] text-center" id="weekly-range-text"></span>
                                <button onclick="window.changeWeek(1)" class="w-7 h-7 flex items-center justify-center rounded bg-gray-100 text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 transition-colors"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                            </div>
                        </div>
                        <div id="weekly-container" class="space-y-3 overflow-y-auto pr-2 flex-1"></div>
                    </div>
                </div>

                <!-- 우측 영역 -->
                <div class="w-full xl:w-96 flex flex-col gap-6 shrink-0">
                    
                    <!-- 타임라인 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex-1 flex flex-col h-[400px]">
                        <div class="mb-4 border-b pb-3 shrink-0">
                            <h3 class="text-lg text-gray-800 flex items-center gap-2" id="selected-date-display"></h3>
                            <p class="text-sm text-gray-500 mt-1" id="task-progress-text">0개의 작업 중 0개 완료</p>
                        </div>
                        <div id="timeline-container" class="flex-1 overflow-y-auto pr-2 space-y-4 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-300 before:to-transparent min-h-[200px]"></div>
                    </div>

                    <!-- 일일 메모장 -->
                    <div class="bg-yellow-50 rounded-2xl shadow-sm border border-yellow-100 p-5 h-56 flex flex-col shrink-0">
                        <div class="flex items-center justify-between mb-3 border-b border-yellow-200/50 pb-2 shrink-0">
                            <h3 class="font-bold text-yellow-800 text-sm flex items-center">
                                <i class="fa-regular fa-note-sticky mr-1.5"></i>작업 메모 (<span id="memo-date-label"></span>)
                            </h3>
                            <button id="memo-save-btn" onclick="window.saveDailyMemo()" class="text-xs bg-yellow-200 hover:bg-yellow-300 text-yellow-800 px-2.5 py-1.5 rounded font-bold transition-colors flex items-center gap-1 shadow-sm">
                                <i id="memo-save-icon" class="fa-solid fa-floppy-disk"></i> <span id="memo-save-text">저장</span>
                            </button>
                        </div>
                        <textarea id="daily-memo-content" class="w-full flex-1 bg-transparent border-none resize-none focus:ring-0 text-sm text-yellow-900 placeholder-yellow-600/50" placeholder="해당 날짜에 대한 아이디어나 특이사항을 자유롭게 기록하세요."></textarea>
                    </div>
                </div>
            </div>

            <!-- ==================== 뷰: 전체 업무 리스트 ==================== -->
            <div id="view-all-tasks" class="view-section flex-1 overflow-y-auto p-6">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-full min-h-[600px]">
                    <div class="p-5 border-b border-gray-100 bg-gray-50 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 shrink-0">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6">
                            <h3 class="font-bold text-lg text-gray-800"><i class="fa-solid fa-list-check mr-2 text-indigo-500"></i>업무 내역</h3>
                            <div class="flex bg-gray-200/60 p-1 rounded-lg w-fit">
                                <button id="tab-alltasks-week" onclick="window.setAllTasksMode('week')" class="px-4 py-1.5 rounded-md text-sm font-bold transition-all text-gray-500 hover:text-gray-700 hover:bg-gray-200">주간</button>
                                <button id="tab-alltasks-month" onclick="window.setAllTasksMode('month')" class="px-4 py-1.5 rounded-md text-sm font-bold transition-all bg-white shadow-sm text-indigo-600">월간</button>
                                <button id="tab-alltasks-year" onclick="window.setAllTasksMode('year')" class="px-4 py-1.5 rounded-md text-sm font-bold transition-all text-gray-500 hover:text-gray-700 hover:bg-gray-200">연간</button>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-start">
                            <div class="flex items-center gap-2">
                                <button onclick="window.changeAllTasksPeriod(-1)" class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-500"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                <span class="text-base font-bold text-gray-700 min-w-[130px] text-center" id="all-tasks-period-display"></span>
                                <button onclick="window.changeAllTasksPeriod(1)" class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-500"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                            </div>
                            <span class="text-sm font-medium text-gray-500 bg-white px-3 py-1 rounded-full border border-gray-200" id="all-tasks-count">총 0건</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr class="bg-white text-gray-500 text-sm border-b sticky top-0 shadow-sm z-10">
                                    <th class="p-4 font-semibold w-32">날짜</th>
                                    <th class="p-4 font-semibold w-36">시간</th>
                                    <th class="p-4 font-semibold w-36">분류</th>
                                    <th class="p-4 font-semibold">업무 내용</th>
                                    <th class="p-4 font-semibold w-24 text-center">상태</th>
                                    <th class="p-4 font-semibold w-24 text-right">관리</th>
                                </tr>
                            </thead>
                            <tbody id="all-tasks-tbody" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ==================== 뷰: 작업 통계 ==================== -->
            <div id="view-statistics" class="view-section flex-1 overflow-y-auto p-6">
                <div class="max-w-5xl mx-auto space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-2xl"><i class="fa-solid fa-layer-group"></i></div>
                            <div><p class="text-gray-500 text-sm font-medium">등록된 총 업무</p><h4 class="text-2xl font-bold text-gray-800" id="stat-total-tasks">0건</h4></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-green-50 text-green-500 flex items-center justify-center text-2xl"><i class="fa-solid fa-check-double"></i></div>
                            <div><p class="text-gray-500 text-sm font-medium">완료율</p><h4 class="text-2xl font-bold text-gray-800" id="stat-completion-rate">0%</h4></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center text-2xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
                            <div><p class="text-gray-500 text-sm font-medium">총 작업 시간</p><h4 class="text-2xl font-bold text-gray-800" id="stat-total-hours">0시간</h4></div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                        <h3 class="font-bold text-lg text-gray-800 mb-6 border-b pb-3"><i class="fa-solid fa-chart-bar mr-2 text-indigo-500"></i>작업 분류별 통계</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10" id="stat-categories-container"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ==========================================
         [3] 각종 모달 창 영역
    ========================================== -->

    <!-- ✅ 상세 작업 내역 모달 (가로/세로 확장) -->
    <div id="task-detail-modal" class="fixed inset-0 bg-black/50 z-[65] flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl h-[85vh] overflow-hidden animate-fade-in-up flex flex-col">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0">
                <div class="flex items-center gap-3">
                    <span id="detail-category-badge" class="px-2.5 py-1 rounded text-[11px] font-bold uppercase tracking-wider"></span>
                    <h3 class="font-bold text-lg text-gray-800 truncate max-w-[200px] sm:max-w-[400px]" id="detail-task-title">업무 제목</h3>
                </div>
                <button onclick="window.closeTaskDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 flex-1 flex flex-col overflow-hidden min-h-0 bg-white">
                <div class="flex justify-between items-end mb-4 shrink-0">
                    <div class="flex items-center text-sm text-gray-500 font-medium bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                        <i class="fa-regular fa-calendar mr-2 text-indigo-400"></i> <span id="detail-task-date"></span>
                        <i class="fa-regular fa-clock ml-5 mr-2 text-indigo-400"></i> <span id="detail-task-time"></span>
                    </div>
                    
                    <!-- 글머리 추가 버튼 -->
                    <div class="flex gap-2">
                        <button type="button" onclick="window.insertAtCursor('★ ')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md text-xs font-bold transition-colors shadow-sm border border-gray-200"><i class="fa-solid fa-star text-yellow-500 mr-1"></i> 대분류 (★)</button>
                        <button type="button" onclick="window.insertAtCursor(' - ')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md text-xs font-bold transition-colors shadow-sm border border-gray-200"><i class="fa-solid fa-minus text-gray-400 mr-1"></i> 소분류 (-)</button>
                    </div>
                </div>
                
                <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-list text-gray-400"></i> 상세 작업 내역
                </label>
                <textarea id="detail-task-desc" class="w-full flex-1 px-5 py-4 border border-gray-200 bg-gray-50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none resize-none text-base leading-relaxed transition-colors shadow-inner" placeholder="이 업무의 진행 상황, 수정 피드백 등 상세 내용을 기록하세요.&#10;(상단 버튼을 눌러 글머리 기호를 추가할 수 있으며, 엔터 시 자동 연장됩니다)"></textarea>
                <input type="hidden" id="detail-task-id">
            </div>
            
            <div class="p-5 border-t border-gray-100 flex gap-3 shrink-0 bg-gray-50">
                <button type="button" onclick="window.closeTaskDetailModal()" class="flex-1 px-4 py-3 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 font-bold transition-colors shadow-sm">닫기</button>
                <button type="button" onclick="window.saveTaskDetail()" class="flex-1 px-4 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-bold transition-colors flex justify-center items-center gap-2 shadow-md shadow-indigo-200">
                    <span id="detail-save-text">내역 저장</span>
                    <div id="detail-save-loader" class="loader !w-4 !h-4 !border-[2px] hidden border-t-white border-white/30"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         [4] Firebase SDK 및 핵심 자바스크립트 로직
    ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. Firebase 접속 정보 세팅
        const firebaseConfig = {
            apiKey: "AIzaSyBD5-AJDFJKsneHyqH70SlNU9VixDAHl3o",
            authDomain: "openzeroc.firebaseapp.com",
            projectId: "openzeroc",
            storageBucket: "openzeroc.firebasestorage.app",
            messagingSenderId: "465944510778",
            appId: "1:465944510778:web:df0d19b7c6b98d129f5003"
        };

        // 2. 글로벌 전역 상태 변수들
        let app, auth, db;
        let currentUser = null;
        let tasksUnsub = null;
        let catsUnsub = null;
        let memoUnsub = null;
        
        let isSignUpMode = false;
        let pendingConfirmAction = null;

        let currentDate = new Date();
        let selectedDate = new Date();
        let weeklyBrowseDate = new Date();
        
        let allTasksMode = 'month';
        let allTasksDate = new Date();
        
        let pickingMonthYear = new Date().getFullYear();
        let pickingWeekYear = new Date().getFullYear();
        
        let currentView = 'dashboard';
        let categories = {};
        let tasks = [];
        let publicHolidaysCache = {};

        // 디자인 팔레트
        const colorPalette = {
            'blue': { color: 'bg-blue-100 text-blue-800 border-blue-200', dot: 'bg-blue-500', hex: '#3b82f6' },
            'orange': { color: 'bg-orange-100 text-orange-800 border-orange-200', dot: 'bg-orange-500', hex: '#f97316' },
            'zinc': { color: 'bg-zinc-100 text-zinc-800 border-zinc-300', dot: 'bg-zinc-800', hex: '#3f3f46' },
            'pink': { color: 'bg-pink-100 text-pink-800 border-pink-200', dot: 'bg-pink-500', hex: '#ec4899' },
            'purple': { color: 'bg-purple-100 text-purple-800 border-purple-200', dot: 'bg-purple-500', hex: '#a855f7' },
            'emerald': { color: 'bg-emerald-100 text-emerald-800 border-emerald-200', dot: 'bg-emerald-500', hex: '#10b981' },
            'red': { color: 'bg-red-100 text-red-800 border-red-200', dot: 'bg-red-500', hex: '#ef4444' },
            'yellow': { color: 'bg-yellow-100 text-yellow-800 border-yellow-200', dot: 'bg-yellow-500', hex: '#eab308' }
        };

        const defaultCategories = {
            'cat_story': { id: 'cat_story', name: '스토리/콘티', colorBase: 'blue', icon: 'fa-book-open' },
            'cat_sketch': { id: 'cat_sketch', name: '스케치', colorBase: 'orange', icon: 'fa-pencil' },
            'cat_line': { id: 'cat_line', name: '펜선', colorBase: 'zinc', icon: 'fa-pen-clip' },
            'cat_color': { id: 'cat_color', name: '채색/명암', colorBase: 'pink', icon: 'fa-palette' },
            'cat_edit': { id: 'cat_edit', name: '식자/편집', colorBase: 'purple', icon: 'fa-font' },
            'cat_etc': { id: 'cat_etc', name: '기타/미팅', colorBase: 'emerald', icon: 'fa-mug-hot' }
        };

        // 3. 헬퍼/유틸리티 함수들
        function formatDateString(d) { 
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; 
        }

        function getWeekNumber(d) { 
            const dt = new Date(d.getTime()); 
            dt.setHours(0, 0, 0, 0); 
            dt.setDate(dt.getDate() + 3 - (dt.getDay() + 6) % 7); 
            const w1 = new Date(dt.getFullYear(), 0, 4); 
            return { 
                year: dt.getFullYear(), 
                week: 1 + Math.round(((dt.getTime() - w1.getTime()) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7) 
            }; 
        }

        function getWeeksInYear(y) { 
            const w = getWeekNumber(new Date(y, 11, 31)); 
            return w.week === 1 ? getWeekNumber(new Date(y, 11, 24)).week : w.week; 
        }

        function getDateOfISOWeek(w, y) { 
            const d = new Date(y, 0, 4); 
            d.setDate(d.getDate() - d.getDay() + (w - 1) * 7); 
            return d; 
        }

        function calcDuration(s, e) { 
            if(!s || !e) return 0; 
            const [sh, sm] = s.split(':').map(Number);
            const [eh, em] = e.split(':').map(Number); 
            let m = (eh * 60 + em) - (sh * 60 + sm); 
            if(m < 0) m += 24 * 60; 
            return m / 60; 
        }

        async function fetchKoreanHolidays(y) { 
            if(publicHolidaysCache[y]) return; 
            try { 
                const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/KR`); 
                if(r.ok) { 
                    const h = await r.json(); 
                    publicHolidaysCache[y] = {}; 
                    h.forEach(x => publicHolidaysCache[y][x.date] = x.localName); 
                } 
            } catch(e) {
                console.warn('휴일 정보를 가져올 수 없습니다.', e);
            } 
        }

        // 4. 앱 초기화 및 Firebase 연동
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    // Firebase 보안 강화를 위해 세팅된 구조
                    currentUser = user;
                    
                    // UI 처리
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('app-view').classList.remove('hidden');
                    document.getElementById('sync-status').className = 'w-2 h-2 rounded-full bg-green-500 inline-block';
                    document.getElementById('sync-text').textContent = '서버 연결됨';
                    document.getElementById('user-email-display').textContent = user.email;
                    
                    // 기존 리스너가 있다면 정리
                    if (tasksUnsub) tasksUnsub();
                    if (catsUnsub) catsUnsub();
                    if (memoUnsub) memoUnsub();

                    // 업무 데이터 실시간 로드 (Firestore)
                    tasksUnsub = onSnapshot(collection(db, 'daily_work', currentUser.uid, 'daily'), (snapshot) => {
                        tasks = snapshot.docs.map(doc => doc.data());
                        window.updateAllUI();
                    });

                    // 카테고리 데이터 실시간 로드 (Firestore)
                    catsUnsub = onSnapshot(collection(db, 'daily_work', currentUser.uid, 'categories'), (snapshot) => {
                        if (snapshot.empty && Object.keys(categories).length === 0) {
                            Object.values(defaultCategories).forEach(cat => {
                                setDoc(doc(db, 'daily_work', currentUser.uid, 'categories', cat.id), cat);
                            });
                        } else {
                            categories = {};
                            snapshot.docs.forEach(d => categories[d.id] = d.data());
                            window.renderCategoryDropdown();
                            window.renderCategoryManagerList();
                            window.updateAllUI();
                        }
                    });
                } else {
                    currentUser = null;
                    document.getElementById('login-view').classList.remove('hidden');
                    document.getElementById('app-view').classList.add('hidden');
                    
                    if (tasksUnsub) tasksUnsub();
                    if (catsUnsub) catsUnsub();
                    if (memoUnsub) memoUnsub();
                    
                    tasksUnsub = null;
                    catsUnsub = null;
                    memoUnsub = null;
                    
                    tasks = []; 
                    categories = {};
                }
            });
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        // 5. DOM 로드 완료 후 폼 이벤트 리스너 연결
        document.addEventListener('DOMContentLoaded', async () => {
            window.initColorPicker();
            await fetchKoreanHolidays(currentDate.getFullYear());
            window.updateAllUI();

            // [로그인 및 회원가입]
            document.getElementById('auth-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('auth-email').value.trim();
                const pw = document.getElementById('auth-password').value;
                const err = document.getElementById('auth-error-msg');
                const btn = document.getElementById('auth-submit-text');
                const ldr = document.getElementById('auth-submit-loader');

                err.classList.add('hidden'); 
                btn.classList.add('hidden'); 
                ldr.classList.remove('hidden');
                
                try {
                    if (isSignUpMode) {
                        await createUserWithEmailAndPassword(auth, email, pw);
                    } else {
                        await signInWithEmailAndPassword(auth, email, pw);
                    }
                    document.getElementById('auth-form').reset();
                } catch(error) {
                    err.textContent = isSignUpMode ? `가입 실패: ${error.message}` : `로그인 실패: 이메일이나 비밀번호를 확인해주세요.`;
                    err.classList.remove('hidden');
                } finally {
                    btn.classList.remove('hidden'); 
                    ldr.classList.add('hidden');
                }
            });

            // [업무 추가/수정 저장]
            document.getElementById('add-task-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if(!currentUser) return;
                
                document.getElementById('task-submit-text').classList.add('hidden');
                document.getElementById('task-submit-loader').classList.remove('hidden');

                const id = document.getElementById('edit-task-id').value;
                const data = {
                    title: document.getElementById('task-title').value,
                    date: document.getElementById('task-date').value,
                    startTime: document.getElementById('task-start').value,
                    endTime: document.getElementById('task-end').value,
                    category: document.getElementById('task-category').value,
                };
                const docId = id || Date.now().toString();

                try {
                    const ref = doc(db, 'daily_work', currentUser.uid, 'daily', docId);
                    if (id) {
                        await setDoc(ref, data, { merge: true });
                    } else {
                        await setDoc(ref, { id: docId, completed: false, description: '', ...data });
                    }
                    window.selectDay(data.date);
                    window.closeTaskModal();
                } catch(err) { 
                    window.showCustomAlert('저장 실패', err.message, 'error'); 
                } finally { 
                    document.getElementById('task-submit-text').classList.remove('hidden'); 
                    document.getElementById('task-submit-loader').classList.add('hidden'); 
                }
            });

            // [카테고리 추가/수정 저장]
            document.getElementById('category-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if(!currentUser) return;
                
                document.getElementById('cat-submit-text').classList.add('hidden');
                document.getElementById('cat-submit-loader').classList.remove('hidden');

                const id = document.getElementById('edit-cat-id').value;
                const name = document.getElementById('cat-name').value;
                const colorBase = document.getElementById('cat-color').value;
                const docId = id || 'cat_' + Date.now();
                const icons = ['fa-tag', 'fa-bookmark', 'fa-star', 'fa-fire', 'fa-bolt', 'fa-check'];

                try {
                    const ref = doc(db, 'daily_work', currentUser.uid, 'categories', docId);
                    if (id) {
                        await setDoc(ref, { name, colorBase }, { merge: true });
                    } else {
                        await setDoc(ref, { id: docId, name, colorBase, icon: icons[Math.floor(Math.random()*icons.length)] });
                    }
                    window.resetCategoryForm();
                } catch(err) { 
                    window.showCustomAlert('카테고리 에러', err.message, 'error'); 
                } finally { 
                    document.getElementById('cat-submit-text').classList.remove('hidden'); 
                    document.getElementById('cat-submit-loader').classList.add('hidden'); 
                }
            });

            // ✅ 상세 작업 모달: 글머리 기호(★, -) 자동 연장 (Enter 키 감지)
            document.getElementById('detail-task-desc').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const start = this.selectionStart;
                    const val = this.value;
                    const lastLine = val.substring(0, start).split('\n').pop();
                    
                    const match = lastLine.match(/^(\s*(?:★|-)\s*)/);
                    if (match) {
                        e.preventDefault();
                        if (lastLine === match[1]) {
                            // 글머리 기호만 남은 줄에서 엔터를 치면 기호를 지우고 빠져나옴
                            this.value = val.substring(0, start - match[1].length) + '\n' + val.substring(this.selectionEnd);
                            this.selectionStart = this.selectionEnd = start - match[1].length + 1;
                        } else {
                            // 대분류(★) 입력 후 엔터를 치면 소분류(-)로 자동 유도, 소분류는 소분류(-) 유지
                            let prefix = match[1];
                            if (prefix.trim() === '★') {
                                prefix = ' - '; 
                            }
                            this.value = val.substring(0, start) + '\n' + prefix + val.substring(this.selectionEnd);
                            this.selectionStart = this.selectionEnd = start + 1 + prefix.length;
                        }
                    }
                }
            });
        });

                ds = `<span class="text-indigo-600 font-extrabold mr-1">오늘</span> ` + ds;

        window.renderCalendar = () => {
            const grid = document.getElementById('calendar-grid'); 
            grid.innerHTML = '';
            
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth(); 
            const fd = new Date(y, m, 1).getDay();
            const dim = new Date(y, m+1, 0).getDate();
            const ts = formatDateString(new Date());
            const ss = formatDateString(selectedDate);
            
            for(let i=0; i<fd; i++) {
                grid.innerHTML += `<div class="p-2 border border-transparent"></div>`;
            }
            
            for(let d=1; d<=dim; d++) {
                const dt = new Date(y, m, d);
                const ds = formatDateString(dt);
                const dw = dt.getDay();
                
                let tc = 'text-gray-700';

                else if(dw===6) tc = 'text-blue-500';

                const dtks = tasks.filter(t => t.date === ds);

        window.renderWeekly = () => {

            const s = new Date(weeklyBrowseDate);

        };

        window.renderMonthPickerGrid = () => {
            document.getElementById('picker-year-text').textContent = `${pickingMonthYear}년`; 
            const g = document.getElementById('picker-month-grid'); 
            g.innerHTML = '';
            
            for(let i=1; i<=12; i++){ 
                const c = (pickingMonthYear === currentDate.getFullYear() && i-1 === currentDate.getMonth()); 
                g.innerHTML += `<button onclick="window.selectMonthFromPicker(${i-1})" class="py-3.5 rounded-xl font-bold transition-all text-sm ${c ? 'bg-indigo-600 text-white' : 'bg-gray-50 text-gray-700 hover:bg-indigo-50'}">${i}월</button>`; 
            }
        };

        window.renderWeekPickerGrid = () => {
            document.getElementById('picker-week-year-text').textContent = `${pickingWeekYear}년`; 
            const g = document.getElementById('picker-week-grid'); 
            g.innerHTML = '';
            
            const t = getWeeksInYear(pickingWeekYear);
            const s = new Date(weeklyBrowseDate); 
            s.setDate(s.getDate() - s.getDay()); 
            const cur = getWeekNumber(s);
            
            for(let i=1; i<=t; i++){ 
                const ic = (pickingWeekYear === cur.year && i === cur.week);
                const ws = getDateOfISOWeek(i, pickingWeekYear);
                const we = new Date(ws); 
                we.setDate(we.getDate()+6); 
                
                const titleRange = `${ws.getMonth()+1}월 ${ws.getDate()}일 ~ ${we.getMonth()+1}월 ${we.getDate()}일`;
                g.innerHTML += `<button onclick="window.selectWeekFromPicker(${i})" title="${titleRange}" class="w-10 h-10 mx-auto rounded-full font-bold text-sm flex items-center justify-center transition-all ${ic ? 'bg-indigo-600 text-white scale-110' : 'bg-gray-50 text-gray-700 hover:bg-indigo-50'}">${i}</button>`; 
            }
        };

        window.renderTimeline = () => {
            const cont = document.getElementById('timeline-container'); 
            cont.innerHTML = '';
            
            const ds = formatDateString(selectedDate);
            const dtks = tasks.filter(t => t.date === ds).sort((a,b) => a.startTime.localeCompare(b.startTime));
            const done = dtks.filter(t => t.completed).length;
            
            document.getElementById('task-progress-text').textContent = `총 ${dtks.length}개 작업 중 ${done}개 완료`;
            
            if(!dtks.length) { 
                cont.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm flex flex-col items-center"><i class="fa-regular fa-folder-open text-3xl mb-3 opacity-50"></i>이 날의 일정이 없습니다.</div>'; 
                return; 
            }
            
            dtks.forEach(t => {
                const c = categories[t.category] || { name: '삭제된 분류', colorBase: 'zinc', icon: 'fa-tag' };
                const cc = colorPalette[c.colorBase] || colorPalette.zinc;
                
                cont.insertAdjacentHTML('beforeend', `
                    <div class="relative flex items-start gap-4 group pl-1 ${t.completed ? 'opacity-60':''}">
                        <div class="flex items-center justify-center w-8 h-8 rounded-full border-[3px] border-white ${cc.color} shrink-0 shadow-sm z-10 mt-1 cursor-pointer hover:scale-110 transition-transform" onclick="window.toggleTask('${t.id}')">
                            <i class="fa-solid ${t.completed ? 'fa-check text-green-600' : c.icon} text-xs"></i>
                        </div>
                        <div class="flex-1 p-3.5 rounded-xl border ${cc.color} bg-white shadow-sm flex flex-col gap-1.5 hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start">
                                <div class="cursor-pointer group-hover:opacity-80 transition-opacity" onclick="window.openTaskDetail('${t.id}')" title="상세 내역 보기/수정">
                                    <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold mb-1 ${cc.color} border-none bg-opacity-50 uppercase tracking-wider">${c.name}</span>
                                    <h4 class="font-bold text-gray-800 text-[15px] leading-tight ${t.completed ? 'line-through text-gray-500' : 'group-hover:text-indigo-600 transition-colors'}">${t.title}</h4>
                                </div>
                                <div class="flex gap-1 shrink-0 ml-2">
                                    <button onclick="window.editTask('${t.id}')" class="text-gray-300 hover:text-indigo-500 transition-colors p-1" title="시간/분류 수정"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="window.promptDelete('task','${t.id}')" class="text-gray-300 hover:text-red-500 transition-colors p-1" title="삭제"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                            <div class="flex items-center text-xs text-gray-500 font-medium">
                                <i class="fa-regular fa-clock mr-1"></i>${t.startTime} - ${t.endTime}
                            </div>
                        </div>
                    </div>
                `);
            });
        };

        window.renderAllTasks = () => {
            let ss, es, dt;
            if(allTasksMode === 'year') { 
                const y = allTasksDate.getFullYear(); 
                ss = `${y}-01-01`; 
                es = `${y}-12-31`; 
                dt = `${y}년`; 
            } else if(allTasksMode === 'month') { 
                const y = allTasksDate.getFullYear(), m = allTasksDate.getMonth(); 
                ss = formatDateString(new Date(y, m, 1)); 
                es = formatDateString(new Date(y, m+1, 0)); 
                dt = `${y}년 ${m+1}월`; 
            } else { 
                const s = new Date(allTasksDate); 
                s.setDate(s.getDate() - s.getDay()); 
                const e = new Date(s); 
                e.setDate(e.getDate() + 6); 
                ss = formatDateString(s); 
                es = formatDateString(e); 
                dt = `${getWeekNumber(s).year}년 ${getWeekNumber(s).week}주차`; 
            }
            
            document.getElementById('all-tasks-period-display').textContent = dt;
            const ft = tasks.filter(t => t.date >= ss && t.date <= es); 
            document.getElementById('all-tasks-count').textContent = `총 ${ft.length}건`;
            
            const tb = document.getElementById('all-tasks-tbody'); 
            tb.innerHTML = '';
            
            if(!ft.length){ 
                tb.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">해당 기간(${dt})에 등록된 업무가 없습니다.</td></tr>`; 
                return; 
            }
            
            [...ft].sort((a,b) => b.date.localeCompare(a.date) || b.startTime.localeCompare(a.startTime)).forEach(t => {
                const c = categories[t.category] || { name: '미지정', colorBase: 'zinc' };
                const cc = colorPalette[c.colorBase] || colorPalette.zinc;
                const statusHtml = t.completed ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold">완료</span>' : '<span class="px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-bold">진행중</span>';
                
                tb.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors cursor-pointer group" onclick="window.openTaskDetail('${t.id}')" title="상세 내역 보기">
                        <td class="p-4 text-gray-600 font-medium">${t.date}</td>
                        <td class="p-4 text-gray-500 text-xs"><i class="fa-regular fa-clock mr-1"></i>${t.startTime} - ${t.endTime}</td>
                        <td class="p-4">
                            <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded text-xs font-bold ${cc.color}">
                                <div class="w-1.5 h-1.5 rounded-full ${cc.dot}"></div>${c.name}
                            </span>
                        </td>
                        <td class="p-4 font-bold text-gray-800 ${t.completed ? 'line-through text-gray-400' : 'group-hover:text-indigo-600'} transition-colors">${t.title}</td>
                        <td class="p-4 text-center" onclick="event.stopPropagation(); window.toggleTask('${t.id}')">${statusHtml}</td>
                        <td class="p-4 text-right">
                            <button onclick="event.stopPropagation(); window.editTask('${t.id}')" class="text-gray-400 hover:text-indigo-600 p-1 mx-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="event.stopPropagation(); window.promptDelete('task','${t.id}')" class="text-gray-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            });
        };

        window.renderStatistics = () => {
            const total = tasks.length;
            const done = tasks.filter(t => t.completed).length;
            
            document.getElementById('stat-total-tasks').textContent = `${total}건`;
            document.getElementById('stat-completion-rate').textContent = total > 0 ? `${Math.round(done / total * 100)}%` : '0%';
            
            let th = 0; 
            const cs = {}; 
            for(const k in categories) {
                cs[k] = { count: 0, hours: 0, name: categories[k].name, colorBase: categories[k].colorBase };
            }
            
            tasks.forEach(t => { 
                const h = calcDuration(t.startTime, t.endTime); 
                th += h; 
                const k = categories[t.category] ? t.category : 'etc'; 
                if(cs[k]) {
                    cs[k].count++; 
                    cs[k].hours += h;
                } 
            });
            
            document.getElementById('stat-total-hours').textContent = `${th.toFixed(1)}시간`;
            
            const cont = document.getElementById('stat-categories-container'); 
            cont.innerHTML = '';
            
            Object.values(cs).sort((a,b) => b.hours - a.hours).forEach(s => {
                if(!s.count) return; 
                const cc = colorPalette[s.colorBase] || colorPalette.zinc;
                const p = th > 0 ? (s.hours / th * 100) : 0;
                cont.innerHTML += `
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <span class="font-bold text-gray-700 flex items-center gap-2">
                                <div class="w-2.5 h-2.5 rounded-full ${cc.dot}"></div>${s.name}
                            </span>
                            <div class="text-right">
                                <span class="text-sm font-bold text-gray-800">${s.hours.toFixed(1)}h</span>
                                <span class="text-xs text-gray-500 ml-1">(${s.count}건)</span>
                            </div>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3.5 overflow-hidden">
                            <div class="h-3.5 rounded-full ${cc.dot} transition-all duration-1000" style="width:${p}%"></div>
                        </div>
                    </div>`;
            });
            if(!tasks.length) {
                cont.innerHTML = '<div class="col-span-2 text-center text-gray-400 py-10">데이터가 부족합니다. 업무를 추가해주세요.</div>';
            }
        };

        window.renderCategoryDropdown = () => {
            const sel = document.getElementById('task-category'); 
            if(!sel) return; 
            sel.innerHTML = '';
            for(const [k, c] of Object.entries(categories)) {
                sel.innerHTML += `<option value="${k}">${c.name}</option>`;
            }
        };

        window.renderCategoryManagerList = () => {
            const cont = document.getElementById('category-list'); 
            if(!cont) return; 
            cont.innerHTML = '';
            for(const [k, c] of Object.entries(categories)) { 
                const cc = colorPalette[c.colorBase] || colorPalette.zinc; 
                cont.innerHTML += `
                    <div class="flex items-center justify-between p-3 border border-gray-100 rounded-lg hover:bg-gray-50 bg-white shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full ${cc.color} flex items-center justify-center text-sm"><i class="fa-solid ${c.icon}"></i></div>
                            <span class="font-bold text-gray-700 text-sm">${c.name}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.editCategory('${k}')" class="text-gray-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen text-sm"></i></button>
                            <button onclick="window.promptDelete('category','${k}')" class="text-gray-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can text-sm"></i></button>
                        </div>
                    </div>`; 
            }
        };
    </script>
</body>
</html>
