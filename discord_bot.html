<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출석 현황</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root{
  --ink:#14141C;
  --surface:#1E1E2A;
  --surface-2:#252533;
  --line:#31314A;
  --accent:#6A73F0;
  --live:#45C77A;
  --warn:#E8A33D;
  --text:#EDEDF2;
  --muted:#8A8A9E;

  --display:"Space Grotesk","Pretendard",sans-serif;
  --body:"Pretendard",system-ui,sans-serif;
  --mono:"JetBrains Mono",monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--body);
  line-height:1.6;
  padding:32px 20px 80px;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:820px;margin:0 auto}

/* ---------- 상단 연결 표시등 ---------- */
.status{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  margin-bottom:28px;
}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--muted);
  flex-shrink:0;
}
.dot.on{
  background:var(--live);
  box-shadow:0 0 0 0 rgba(69,199,122,.6);
  animation:pulse 2.2s infinite;
}
.dot.err{background:var(--warn)}
@keyframes pulse{
  70%{box-shadow:0 0 0 9px rgba(69,199,122,0)}
  100%{box-shadow:0 0 0 0 rgba(69,199,122,0)}
}
.status-text{font-size:14px;color:var(--muted)}
.status-text b{color:var(--text);font-weight:500}

/* ---------- 제목 ---------- */
h1{
  font-family:var(--display);
  font-size:clamp(28px,6vw,40px);
  font-weight:700;
  letter-spacing:-.02em;
  margin-bottom:6px;
}
.sub{color:var(--muted);font-size:14px;margin-bottom:32px}

/* ---------- 통계 ---------- */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:36px;
}
.stat{
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  padding:18px 16px;
}
.stat .num{
  font-family:var(--display);
  font-size:32px;font-weight:700;
  line-height:1;
  display:block;margin-bottom:6px;
}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat.today .num{color:var(--live)}

/* ---------- 기록 목록 ---------- */
.head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:14px;
}
.head h2{
  font-family:var(--display);
  font-size:15px;font-weight:500;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);
}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:8px}

.row{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
}
.row.new{animation:slide .5s ease}
@keyframes slide{
  from{opacity:0;transform:translateY(-8px);border-color:var(--accent)}
  to{opacity:1;transform:none}
}

.tag{
  font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:6px;
  flex-shrink:0;margin-top:2px;
  background:var(--surface-2);color:var(--muted);
}
.tag.출석{background:rgba(69,199,122,.14);color:var(--live)}
.tag.등록{background:rgba(106,115,240,.16);color:var(--accent)}
.tag.경험치{background:rgba(106,115,240,.16);color:var(--accent)}
.tag.아데나{background:rgba(232,163,61,.16);color:var(--warn)}

.body-col{flex:1;min-width:0}
.who{font-size:13px;font-weight:600;margin-bottom:2px}
.txt{font-size:14px;color:#C9C9D6;word-break:break-word}
.when{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  flex-shrink:0;margin-top:3px;
}

/* ---------- 빈 화면 / 오류 ---------- */
.empty{
  border:1px dashed var(--line);
  border-radius:12px;
  padding:40px 20px;text-align:center;
}
.empty p{color:var(--muted);font-size:14px;margin-bottom:10px}
.empty code{
  font-family:var(--mono);font-size:13px;
  background:var(--surface-2);color:var(--accent);
  padding:4px 9px;border-radius:6px;
}

@media (max-width:520px){
  .stats{grid-template-columns:1fr;gap:8px}
  .stat{display:flex;align-items:baseline;gap:12px}
  .stat .num{margin:0;font-size:26px}
  .when{display:none}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="status">
    <span class="dot" id="dot"></span>
    <span class="status-text" id="statusText">연결하는 중</span>
  </div>

  <h1>성장 현황</h1>
  <p class="sub">디스코드에서 남긴 기록이 이 화면에 바로 나타납니다.</p>

  <div class="stats">
    <div class="stat today"><span class="num" id="sExp">0</span><span class="lbl">오늘 경험치 (%p)</span></div>
    <div class="stat"><span class="num" id="sAdena">0</span><span class="lbl">오늘 아데나</span></div>
    <div class="stat"><span class="num" id="sAll">0</span><span class="lbl">전체 기록</span></div>
  </div>

  <div class="head">
    <h2>기록</h2>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   1. Firebase 설정  ← 여기만 본인 값으로 바꾸세요
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBD5-AJDFJKsneHyqH70SlNU9VixDAHl3o",
  authDomain: "openzeroc.firebaseapp.com",
  projectId: "openzeroc",
  storageBucket: "openzeroc.firebasestorage.app",
  messagingSenderId: "465944510778",
  appId: "1:465944510778:web:df0d19b7c6b98d129f5003"
};

const COLLECTION = "discord";

/* ============================================================
   2. 초기화
   ============================================================ */
const dot        = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const listEl     = document.getElementById("list");

let firstLoad = true;
let knownIds  = new Set();

function setStatus(state, msg){
  dot.className = "dot" + (state ? " " + state : "");
  statusText.innerHTML = msg;
}

try{
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling: true, merge: true });

  /* ----- 실시간 구독 ----- */
  db.collection(COLLECTION)
    .orderBy("createdAt", "desc")
    .limit(50)
    .onSnapshot(
      snap => {
        setStatus("on", "실시간 연결됨 · 컬렉션 <b>" + COLLECTION + "</b>");
        render(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      },
      err => {
        setStatus("err", "연결 실패 · " + err.code);
        listEl.innerHTML =
          '<div class="empty"><p>Firestore를 읽지 못했습니다.</p>' +
          '<p>' + err.message + '</p></div>';
      }
    );
}catch(e){
  setStatus("err", "설정 오류");
  listEl.innerHTML =
    '<div class="empty"><p>Firebase 설정값을 확인하세요.</p>' +
    '<p>' + e.message + '</p></div>';
}

/* ============================================================
   3. 화면 그리기
   ============================================================ */
function render(rows){
  document.getElementById("count").textContent = rows.length + "건";

  if(rows.length === 0){
    listEl.innerHTML =
      '<div class="empty"><p>아직 기록이 없습니다.</p>' +
      '<p>디스코드에서 <code>/출석</code> 을 입력해 보세요.</p></div>';
    updateStats([]);
    firstLoad = false;
    return;
  }

  const todayStr = new Date().toDateString();

  listEl.innerHTML = rows.map(r => {
    const d    = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null;
    const when = d ? fmt(d) : "-";
    const isNew = !firstLoad && !knownIds.has(r.id);
    const type = esc(r.type || "기록");

    return '<div class="row' + (isNew ? ' new' : '') + '">' +
             '<span class="tag ' + type + '">' + type + '</span>' +
             '<div class="body-col">' +
               '<div class="who">' + esc(r.userName || '알 수 없음') + '</div>' +
               '<div class="txt">' + esc(r.content || '') + '</div>' +
             '</div>' +
             '<span class="when">' + when + '</span>' +
           '</div>';
  }).join("");

  knownIds = new Set(rows.map(r => r.id));
  firstLoad = false;
  updateStats(rows, todayStr);
}

function updateStats(rows, todayStr){
  let expPP = 0, adena = 0;

  rows.forEach(r => {
    const d = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null;
    if(!d || d.toDateString() !== todayStr) return;
    if(typeof r.gainPP === "number")    expPP += r.gainPP;
    if(typeof r.gainAdena === "number") adena += r.gainAdena;
  });

  const sign = n => (n > 0 ? "+" : "");
  document.getElementById("sExp").textContent   = sign(expPP) + expPP.toFixed(2);
  document.getElementById("sAdena").textContent = sign(adena) + korMoney(adena);
  document.getElementById("sAll").textContent   = rows.length;
}

/* 120000000 -> '1억 2,000만' */
function korMoney(n){
  const neg = n < 0 ? "-" : "";
  n = Math.abs(Math.round(n));
  if(n < 10000) return neg + n.toLocaleString();
  const eok  = Math.floor(n / 100000000);
  const man  = Math.floor((n % 100000000) / 10000);
  const one  = n % 10000;
  const out = [];
  if(eok) out.push(eok.toLocaleString() + "억");
  if(man) out.push(man.toLocaleString() + "만");
  if(one && !eok) out.push(one.toLocaleString());
  return neg + out.join(" ");
}

/* ----- 도우미 ----- */
function fmt(d){
  const p = n => String(n).padStart(2, "0");
  return p(d.getMonth()+1) + "/" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes());
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
</script>
</body>
</html>
