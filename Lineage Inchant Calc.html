<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리니지 클래식 인챈트 자동 매칭 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen flex justify-center items-start">

    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">⚔️ 리니지 클래식 강화 기대값 계산기</h1>
            <p class="text-indigo-200 text-sm md:text-base">공식 확률표 자동 매칭 시스템 적용 (파괴형 일반 강화 기준)</p>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            
            <!-- Info Box -->
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg">
                <p class="text-sm text-blue-800 leading-relaxed">
                    <strong>[안내]</strong> 공식 홈페이지의 확률표가 내장되어 있습니다. 장비 종류를 선택하면 안전 구간과 그 이후의 강화 확률이 자동으로 매칭되어 비용이 계산됩니다.<br>
                    <a href="https://probability.plaync.com/lineageclassic/view?probCategoryId=694e18e593de0d232a346e9c" target="_blank" class="text-blue-600 underline font-bold hover:text-blue-800 mt-2 inline-block">공식 확률 페이지 확인하기</a>
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 아이템 카테고리 선택 -->
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">아이템 종류 (자동 확률 매칭)</label>
                    <select id="itemCategory" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50 transition-colors cursor-pointer">
                        <option value="weapon_normal">일반 무기 (안전 +6 / 이후 성공률 약 33.3% 고정)</option>
                        <option value="weapon_bone">블랙미스릴/뼈 무기 (안전 +0 / 성공률 약 33.3% 고정)</option>
                        <option value="armor_normal">일반 방어구 (안전 +4 / 이후 25%, 20%, 16.6% 등 하락)</option>
                        <option value="armor_elf">요정족 방어구 (안전 +6 / 이후 16.6%, 14.2% 등 하락)</option>
                        <option value="armor_bone">블랙미스릴/뼈 방어구 (안전 +0 / 50%, 33.3%, 25% 등 하락)</option>
                    </select>
                </div>

                <!-- 가격 입력 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">+0 기본 아이템 가격 (아데나)</label>
                    <input type="number" id="basePrice" value="50000" min="0" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">일반 강화 주문서 가격 (아데나)</label>
                    <input type="number" id="scrollPrice" value="100000" min="0" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                </div>

                <!-- 목표 수치 -->
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">목표 강화 수치</label>
                    <div class="flex items-center space-x-4">
                        <input type="range" id="targetSlider" min="1" max="15" value="9" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        <span id="targetDisplay" class="text-2xl font-bold text-indigo-600 w-16 text-center">+9</span>
                    </div>
                </div>
            </div>

            <!-- 계산 버튼 -->
            <button onclick="calculateExpectedValue()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-lg transition-transform transform hover:-translate-y-1 active:translate-y-0">
                결과 계산하기
            </button>

            <!-- 에러 메시지 표시 영역 -->
            <div id="errorMessage" class="hidden bg-red-100 text-red-700 p-3 rounded-lg text-sm text-center font-bold"></div>

        </div>

        <div id="resultArea" class="hidden border-t border-slate-200 bg-slate-50 p-6 md:p-8">
            <h3 class="text-xl font-bold text-slate-800 mb-4 text-center">📊 단계별 기댓값 요약</h3>
            <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-sm">
                <table class="w-full text-sm text-left whitespace-nowrap">
                    <thead class="bg-slate-200 text-slate-700">
                        <tr>
                            <th class="px-4 py-3 text-center">도전 수치</th>
                            <th class="px-4 py-3 text-center">적용 확률</th>
                            <th class="px-4 py-3 text-right">누적 기댓값 (아데나)</th>
                            <th class="px-4 py-3 text-right">소모 템 수</th>
                            <th class="px-4 py-3 text-right">소모 주문서</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="divide-y divide-slate-200 bg-white">
                        <!-- JS에서 행 삽입 -->
                    </tbody>
                </table>
            </div>
            <p class="text-xs text-slate-500 text-center mt-4">* 본 데이터는 무한 시도를 가정한 수학적 기댓값(평균)이므로 실제 게임 플레이와 편차가 있을 수 있습니다.</p>
        </div>

    </div>

    <script>
        // 리니지 방어구 강화 확률 규칙 (1 / 현재 인챈트 수치 등) 적용을 위한 함수
        // 공식 확률표 기준 매 단계마다 정확한 변동 확률을 가져옵니다.
        function getEnchantProbability(category, targetLevel) {
            const currentLevel = targetLevel - 1; // 목표 수치가 5면, 현재 시도 수치는 4
            
            switch(category) {
                case "weapon_normal": // 무기는 6 이후로 항상 1/3 (33.33%)
                    return targetLevel <= 6 ? 1 : (1/3);
                case "weapon_bone": // 뼈 무기는 0부터 항상 1/3 (33.33%)
                    return targetLevel <= 0 ? 1 : (1/3);
                case "armor_normal": // 일반 방어구는 4->5 (1/4), 5->6 (1/5)... (1 / 현재수치)
                    return targetLevel <= 4 ? 1 : (1 / currentLevel);
                case "armor_elf": // 요정 방어구는 6->7 (1/6), 7->8 (1/7)... (1 / 현재수치)
                    return targetLevel <= 6 ? 1 : (1 / currentLevel);
                case "armor_bone": // 뼈 방어구는 0->1 (1/2), 1->2 (1/3)... (1 / (현재수치 + 2))
                    return targetLevel <= 0 ? 1 : (1 / (currentLevel + 2));
                default:
                    return 1;
            }
        }

        // 슬라이더 이벤트 연결
        const targetSlider = document.getElementById('targetSlider');
        const targetDisplay = document.getElementById('targetDisplay');
        
        targetSlider.addEventListener('input', function() {
            targetDisplay.textContent = '+' + this.value;
        });

        // 숫자 포맷 함수 (3자리 콤마)
        function formatNum(num) {
            // 너무 큰 숫자의 경우 지수표기법 방지 및 보기 좋게 포맷팅
            if (num > 1000000000000000) return "측정 불가 (너무 높음)";
            return Math.round(num).toLocaleString('ko-KR');
        }

        function calculateExpectedValue() {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.classList.add('hidden'); // 에러 메시지 초기화

            const categoryKey = document.getElementById('itemCategory').value;
            const basePrice = Number(document.getElementById('basePrice').value);
            const scrollPrice = Number(document.getElementById('scrollPrice').value);
            const targetEnchant = Number(targetSlider.value);

            if (basePrice < 0 || scrollPrice < 0) {
                errorMsg.textContent = "가격은 0 이상의 숫자를 입력해주세요.";
                errorMsg.classList.remove('hidden');
                return;
            }

            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = ''; // 테이블 초기화

            let currentCost = basePrice;
            let expectedItems = 1;
            let expectedScrolls = 0;

            for (let i = 1; i <= targetEnchant; i++) {
                // 각 구간별 정확한 변동 확률 호출
                const prob = getEnchantProbability(categoryKey, i);
                let currentStepProbText = "";
                let isSafe = prob === 1;

                if (isSafe) {
                    // 안전 강화 구간
                    currentCost += scrollPrice;
                    expectedScrolls += 1;
                    currentStepProbText = "100% (안전)";
                } else {
                    // 안전 강화 이후 확률 적용 (실패 시 아이템+주문서 모두 증발)
                    // 기댓값 공식: (이전 단계 무기를 띄우기 위한 비용 + 이번 시도 주문서 비용) / 성공 확률
                    currentCost = (currentCost + scrollPrice) / prob;
                    expectedItems = expectedItems / prob;
                    expectedScrolls = (expectedScrolls + 1) / prob;
                    currentStepProbText = (prob * 100).toFixed(2) + "%";
                }

                // 결과 테이블 행 생성
                const tr = document.createElement('tr');
                
                // 목표 수치 도달 시 하이라이트 효과
                if (i === targetEnchant) {
                    tr.className = "bg-indigo-50 font-bold text-indigo-900";
                } else {
                    tr.className = "hover:bg-slate-50 transition-colors";
                }

                // 기댓값이 너무 커서 계산 범위를 벗어날 경우 대비
                const displayCost = formatNum(currentCost) + (currentCost < 1000000000000000 ? " 아데나" : "");
                const displayItems = formatNum(expectedItems) + " 개";
                const displayScrolls = formatNum(expectedScrolls) + " 장";

                tr.innerHTML = `
                    <td class="px-4 py-3 text-center border-r border-slate-100">
                        <span class="inline-block bg-${isSafe ? 'green' : 'red'}-100 text-${isSafe ? 'green' : 'red'}-800 px-2 py-1 rounded-md text-xs font-bold mr-2">-> +${i}</span>
                    </td>
                    <td class="px-4 py-3 text-center border-r border-slate-100 text-slate-600">${currentStepProbText}</td>
                    <td class="px-4 py-3 text-right border-r border-slate-100 text-red-600 font-semibold">${displayCost}</td>
                    <td class="px-4 py-3 text-right border-r border-slate-100">${displayItems}</td>
                    <td class="px-4 py-3 text-right">${displayScrolls}</td>
                `;
                tbody.appendChild(tr);
            }

            // 결과 영역 보이기 및 부드러운 스크롤 애니메이션
            const resultArea = document.getElementById('resultArea');
            resultArea.classList.remove('hidden');
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 초기 실행 시 화면 세팅을 위해 한번 눌러줌
        window.onload = function() {
            // calculateExpectedValue(); // 초기부터 표를 보여주려면 주석 해제
        };
    </script>
</body>
</html>
